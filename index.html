<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dunedle — Juegos diarios de Dune</title>
    <meta name="description" content="Dunedle es una colección de juegos diarios inspirados en el universo de Dune. Pon a prueba tus conocimientos con un Wordle y otros retos.">

    <style>
        :root {
            --sand: #c2b280;
            --sand-dark: #8e7d50;
            --spice: #9d4edd;
            --bg-black: #0a0a0a;
            --panel-gray: #1a1a1a;
            --text-white: #e0e0e0;
            --correct: #4ade80;
            --present: #facc15;
            --absent: #3f3f46;
            --border-metal: #4a4a4a;
            --tile-size: clamp(45px, 9vw, 65px);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }

        body { transition: background-color 0.4s; }
        .logo, .card h2, .btn-action { transition: color 0.4s, background-color 0.4s, border-color 0.4s; }

        body {
            background-color: var(--bg-black);
            color: var(--text-white);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        #spice-canvas { position: fixed; top: 0; left: 0; z-index: -1; pointer-events: none; }

        header {
            position: sticky;
            top: 0;
            padding: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--border-metal);
            background: rgba(10, 10, 10, 0.9);
            backdrop-filter: blur(5px);
            z-index: 100;
            gap: 0.5rem;
        }

        .logo { color: var(--sand); letter-spacing: 5px; font-weight: 900; cursor: pointer; font-size: 1.8rem; text-shadow: 0 0 10px rgba(194, 178, 128, 0.3); }
        .beta-badge {
            display: inline-block; vertical-align: middle; margin-left: 4px;
            font-size: 0.55rem; letter-spacing: 1px; font-weight: bold;
            color: var(--bg-black); background: var(--sand);
            padding: 2px 6px; border-radius: 6px; text-shadow: none;
        }

        .emoji-slots { display: flex; justify-content: center; gap: 12px; margin: 20px 0; flex-wrap: wrap; }
        .emoji-slot {
            font-size: 2.4rem; width: 64px; height: 64px; flex-shrink: 0;
            display: flex; align-items: center; justify-content: center;
            background: rgba(0,0,0,0.25); border: 2px solid var(--border-metal); border-radius: 12px;
            position: relative; overflow: hidden;
        }
        .emoji-slot-hidden { background: transparent; color: #d8cfc0; }
        .emoji-slot-bg { position: absolute; inset: -6px; background: rgba(157,78,221,0.22); filter: blur(4px); }
        .emoji-slot-mark { position: relative; z-index: 1; }

        .hints-box { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin: 4px 0 16px; }
        .hint-chip { font-size: 0.78rem; padding: 6px 12px; border-radius: 20px; border: 1px solid var(--border-metal); }
        .hint-chip.hint-unlocked { background: rgba(74,222,128,0.12); border-color: var(--correct); color: var(--text-white); }
        .hint-chip.hint-locked { background: rgba(0,0,0,0.2); color: #777; }

        .kanly-vs { display: flex; justify-content: space-between; align-items: center; margin: 10px 0 18px; gap: 10px; }
        .kanly-player { flex: 1; text-align: center; padding: 10px; border-radius: 10px; background: rgba(0,0,0,0.25); border: 2px solid var(--border-metal); }
        .kanly-player.me { border-color: var(--sand); }
        .kanly-player .kanly-score { font-size: 1.8rem; font-weight: bold; color: var(--sand); }
        .kanly-player .kanly-label { font-size: 0.75rem; color: #999; text-transform: uppercase; letter-spacing: 1px; }
        .kanly-vs-divider { font-size: 1.1rem; color: var(--spice); font-weight: bold; }
        .kanly-timer { text-align: center; font-size: 2.2rem; font-weight: bold; color: var(--sand); margin-bottom: 14px; font-variant-numeric: tabular-nums; }
        .kanly-timer.low { color: #ef4444; animation: cellPop 0.5s infinite; }
        .kanly-question-box { text-align: center; margin: 10px 0 20px; animation: kanlyQuestionIn 0.3s ease-out; }
        .kanly-options { animation: kanlyQuestionIn 0.3s ease-out 0.05s backwards; }
        @keyframes kanlyQuestionIn {
            from { opacity: 0; transform: translateY(12px) scale(0.97); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        .kanly-question-emojis { font-size: 2.8rem; margin-bottom: 10px; }
        .kanly-question-quote { font-style: italic; font-size: 1.1rem; color: var(--sand); }
        .kanly-question-trivia { font-size: 1.12rem; font-weight: 600; color: var(--text-white); line-height: 1.4; }
        .kanly-options { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .kanly-option {
            background: var(--panel-gray); border: 2px solid var(--border-metal); border-radius: 10px;
            padding: 14px 8px; font-size: 0.9rem; font-weight: bold; color: var(--text-white); cursor: pointer;
        }
        .kanly-option:active { transform: scale(0.97); }
        .kanly-option.correct { background: var(--correct); border-color: var(--correct); color: #06240f; }
        .kanly-option.wrong { background: #3a1414; border-color: #7a2323; color: #f2b8b8; }
        .kanly-spinner { width: 46px; height: 46px; border: 4px solid var(--border-metal); border-top-color: var(--sand); border-radius: 50%; margin: 20px auto; animation: kanlySpin 1s linear infinite; }
        @keyframes kanlySpin { to { transform: rotate(360deg); } }
        .kanly-result-title { font-size: 1.6rem; font-weight: bold; margin: 10px 0; }
        .kanly-result-title.win { color: var(--correct); }
        .kanly-result-title.lose { color: #ef4444; }
        .kanly-result-title.tie { color: var(--sand); }

        .streak-badge {
            display: inline-flex; align-items: center; gap: 2px;
            font-size: 0.8rem; font-weight: bold; color: var(--sand);
            background: rgba(194,178,128,0.1); border: 1px solid var(--border-metal);
            border-radius: 20px; padding: 3px 8px; white-space: nowrap;
        }

        .header-side { display: flex; align-items: center; gap: 0.5rem; min-width: 90px; }
        .header-side.right { justify-content: flex-end; }
        .icon-btn {
            background: transparent; border: 1px solid var(--border-metal); color: var(--sand);
            width: 34px; height: 34px; border-radius: 50%; cursor: pointer;
            display: flex; align-items: center; justify-content: center; font-size: 1rem;
        }
        .icon-btn:hover { border-color: var(--sand); }

        .faction-choice-row { display: flex; gap: 16px; justify-content: center; margin: 20px 0; }
        .faction-btn {
            background: rgba(0,0,0,0.3); border: 2px solid var(--border-metal); border-radius: 12px;
            padding: 18px 20px; display: flex; flex-direction: column; align-items: center; gap: 8px;
            cursor: pointer; color: var(--text-white); font-weight: bold; flex: 1; max-width: 140px;
            font-size: 0.9rem;
        }
        .faction-btn:hover { border-color: var(--sand); }
        .faction-emoji { font-size: 2.6rem; }
        .faction-clear-link { display: block; margin: 12px auto 0; background: none; border: none; color: #888; text-decoration: underline; font-size: 0.8rem; cursor: pointer; }
        .faction-emblem-btn { font-size: 1.2rem; }

        /* --- Modal --- */
        .modal-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.75);
            display: flex; align-items: center; justify-content: center;
            z-index: 200; padding: 1rem; backdrop-filter: blur(3px);
        }
        .modal-box {
            background: linear-gradient(145deg, var(--panel-gray), #111);
            border: 2px solid var(--border-metal); border-radius: 12px;
            padding: 1.5rem; max-width: 480px; width: 100%; max-height: 85vh; overflow-y: auto;
        }
        .modal-box h2 { color: var(--sand); margin-bottom: 0.8rem; }
        .modal-box h3 { color: var(--sand); margin: 1rem 0 0.3rem; font-size: 1rem; }
        .modal-box p { line-height: 1.5; margin-bottom: 0.4rem; font-size: 0.95rem; }
        .modal-legend { display: flex; gap: 10px; margin: 0.5rem 0; flex-wrap: wrap; }
        .modal-legend span { display: flex; align-items: center; gap: 5px; font-size: 0.85rem; }
        .legend-box { width: 16px; height: 16px; border-radius: 3px; display: inline-block; }

        .share-btn {
            background: transparent; border: 2px solid var(--sand); color: var(--sand);
            padding: 12px; border-radius: 8px; font-weight: bold; width: 100%;
            cursor: pointer; margin-top: 10px; font-size: 1rem;
        }
        .share-btn:active { background: rgba(194,178,128,0.15); }

        #confetti-canvas { position: fixed; top: 0; left: 0; z-index: 300; pointer-events: none; }

        #view-port {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 1rem;
            padding-bottom: 2.5rem;
        }

        /* --- Menú Principal --- */
        .home-menu { display: flex; flex-direction: column; gap: 1rem; width: 100%; max-width: 500px; padding-top: 1rem; }
        .home-subtitle { text-align: center; color: var(--sand); font-size: 0.95rem; letter-spacing: 1px; margin: -0.5rem 0 0.2rem; opacity: 0.85; }
        .disclaimer { font-size: 0.7rem; line-height: 1.4; color: #666; text-align: center; margin-top: 20px; padding: 0 10px 20px; }
        .feedback-box {
            margin-top: 18px; padding: 10px; text-align: center;
            background: rgba(194,178,128,0.06); border: 1px solid var(--border-metal); border-radius: 10px;
        }
        .social-row { display: flex; justify-content: center; gap: 22px; }
        .social-item { display: flex; flex-direction: column; align-items: center; }
        .contact-circle {
            width: 42px; height: 42px; border-radius: 50%;
            background: rgba(194,178,128,0.1); border: 1.5px solid var(--sand); color: var(--sand);
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; margin: 2px auto 4px; padding: 0; transition: background 0.2s;
        }
        .contact-circle:hover { background: rgba(194,178,128,0.22); }
        .contact-circle:active { transform: scale(0.95); }
        .contact-circle svg { width: 19px; height: 19px; }
        .contact-label { font-size: 0.65rem; color: #999; letter-spacing: 1px; text-transform: uppercase; }
        .contact-email { margin-top: 6px; font-size: 0.8rem; max-height: 0; overflow: hidden; transition: max-height 0.25s ease; }
        .contact-email.show { max-height: 40px; }
        .contact-email a { color: var(--sand); font-weight: bold; text-decoration: none; border-bottom: 1px solid var(--sand); padding-bottom: 1px; }
        .card {
            background: linear-gradient(145deg, var(--panel-gray), #111);
            border: 2px solid var(--border-metal);
            padding: 1.5rem;
            border-radius: 12px;
            cursor: pointer;
            position: relative;
            transition: 0.3s;
        }
        .card:hover { border-color: var(--sand); }
        .card h2 { color: var(--sand); margin-bottom: 0.3rem; font-size: 1.4rem; }
        .status-badge { position: absolute; top: 15px; right: 15px; font-size: 1.2rem; }
        .kanly-daily-checks { position: absolute; top: 15px; right: 15px; display: flex; gap: 3px; }
        .kanly-check {
            width: 18px; height: 18px; border-radius: 50%; font-size: 0.65rem; font-weight: bold;
            display: flex; align-items: center; justify-content: center; line-height: 1;
            border: 1.5px solid var(--border-metal); color: transparent;
        }
        .kanly-check.filled { background: var(--correct); border-color: var(--correct); color: #06240f; }

        /* --- Wordle Board --- */
        .grid-container { width: 100%; display: flex; justify-content: center; padding: 10px 0; overflow-x: auto; }
        .grid { display: grid; gap: 8px; width: fit-content; }
        .tile {
            width: var(--tile-size); height: var(--tile-size);
            border: 2px solid var(--border-metal);
            display: flex; justify-content: center; align-items: center;
            font-size: 1.5rem; font-weight: bold; text-transform: uppercase;
            background: rgba(0,0,0,0.5); perspective: 1000px;
        }

        .tile.flip { animation: flip-cell 0.6s ease-in-out forwards; }
        @keyframes flip-cell {
            0% { transform: rotateX(0deg); }
            50% { transform: rotateX(90deg); background: var(--absent); }
            100% { transform: rotateX(0deg); }
        }

        .tile.correct { background: var(--correct); border-color: var(--correct); }
        .tile.present { background: var(--present); border-color: var(--present); color: black; }
        .tile.absent { background: var(--absent); border-color: var(--absent); }

        /* --- Historial --- */
        .history-container { width: 100%; max-width: 400px; margin-top: 20px; }
        .history-item { 
            padding: 10px; margin-bottom: 5px; border-radius: 6px; 
            display: flex; justify-content: space-between;
            animation: slideIn 0.3s ease-out;
        }
        .history-wrong { background: rgba(239, 68, 68, 0.15); border-left: 4px solid #ef4444; color: #ef4444; }
        .history-correct { background: rgba(74, 222, 128, 0.15); border-left: 4px solid var(--correct); color: var(--correct); }

        @keyframes slideIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* --- Teclado --- */
        .keyboard { width: 100%; max-width: 600px; padding: 10px; margin-top: auto; }
        .key-row { display: flex; justify-content: center; gap: 4px; margin-bottom: 6px; }
        .key {
            height: 50px; border-radius: 4px; background: var(--absent); color: white;
            border: 0; flex: 1; font-weight: bold; cursor: pointer; font-size: 0.9rem;
            display: flex; justify-content: center; align-items: center;
        }
        .key.wide { flex: 1.5; }
        .key.correct { background: var(--correct); color: black; }
        .key.present { background: var(--present); color: black; }
        .key.absent-key { background: #222; color: #555; }

        /* --- UI Comprobación --- */
        .input-group { position: relative; width: 100%; max-width: 400px; margin: 20px 0; }
        input[type="text"] {
            width: 100%; padding: 15px; background: var(--panel-gray);
            border: 2px solid var(--border-metal); color: white; border-radius: 8px; font-size: 1.1rem;
        }
        .suggestions {
            position: absolute; top: 100%; left: 0; right: 0;
            background: #222; border: 1px solid var(--spice); border-radius: 8px; z-index: 100; display: none;
        }
        .suggestion-item { padding: 12px; cursor: pointer; border-bottom: 1px solid #333; }
        .suggestion-item:hover { background: var(--spice); }

        /* --- Paneles Finales --- */
        .victory-panel { text-align: center; padding: 1.5rem; width: 100%; max-width: 500px; animation: slideIn 0.5s; }
        .lore-box { background: rgba(0,0,0,0.3); padding: 15px; border-radius: 8px; text-align: left; margin: 15px 0; border-left: 4px solid var(--sand); line-height: 1.5; }
        .meta-tags { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin: 10px 0 15px; }
        .meta-tag { background: rgba(194,178,128,0.12); border: 1px solid var(--border-metal); color: var(--sand); font-size: 0.78rem; padding: 4px 10px; border-radius: 20px; }

        .achv-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; margin: 10px 0 20px; }
        .achv-badge {
            background: rgba(0,0,0,0.3); border: 1px solid var(--border-metal); border-radius: 10px;
            padding: 14px 10px; text-align: center; opacity: 0.55; filter: grayscale(0.6);
        }
        .achv-badge.unlocked { opacity: 1; filter: none; border-color: var(--sand); background: rgba(194,178,128,0.08); }
        .achv-icon { font-size: 1.8rem; margin-bottom: 6px; }
        .achv-title { font-weight: bold; font-size: 0.85rem; color: var(--sand); margin-bottom: 3px; }
        .achv-desc { font-size: 0.7rem; color: #999; line-height: 1.3; margin-bottom: 8px; min-height: 28px; }
        .achv-progress { background: #222; border-radius: 6px; height: 6px; overflow: hidden; }
        .achv-progress-fill { height: 100%; background: var(--correct); }
        .achv-count { font-size: 0.7rem; color: #888; margin-top: 4px; }

        .achv-toast {
            position: fixed; top: -100px; left: 50%; transform: translateX(-50%);
            background: linear-gradient(145deg, var(--panel-gray), #111); border: 2px solid var(--sand);
            border-radius: 12px; padding: 12px 20px; display: flex; align-items: center; gap: 12px;
            z-index: 400; box-shadow: 0 8px 24px rgba(0,0,0,0.5); transition: top 0.4s ease;
            max-width: 90vw;
        }
        .achv-toast.show { top: 16px; }
        .achv-toast-icon { font-size: 1.8rem; }
        .achv-toast-label { font-size: 0.7rem; color: var(--sand); letter-spacing: 0.5px; text-transform: uppercase; }
        .achv-toast-title { font-weight: bold; color: var(--text-white); }

        .char-table-wrap { width: 100%; overflow-x: auto; margin: 15px 0; padding-bottom: 8px; }

        /* En pantallas anchas (PC), este panel puede ser más ancho que el resto
           para que las 7 columnas de la tabla quepan sin necesidad de scroll. */
        @media (min-width: 820px) {
            .victory-panel.who-is-panel { max-width: 900px; }
            .who-is-panel .btn-action, .who-is-panel .share-btn { width: 400px !important; max-width: 400px !important; margin-left: auto !important; margin-right: auto !important; display: block; }
        }
        .char-grid { display: inline-grid; grid-auto-flow: row; grid-template-columns: 130px repeat(6, 100px); gap: 6px; min-width: 100%; }
        .char-cell {
            background: var(--panel-gray); border: 2px solid var(--border-metal); border-radius: 8px;
            padding: 10px 6px; text-align: center; font-size: 0.75rem; line-height: 1.25;
            transition: transform 0.22s ease-in, background-color 0.15s, border-color 0.15s, opacity 0.25s;
            word-break: break-word; display: flex; align-items: center; justify-content: center;
            transform: scale(1) rotateX(0deg); opacity: 1;
        }
        .char-cell.header-cell { background: transparent; border: none; color: var(--sand); font-size: 0.68rem; text-transform: uppercase; font-weight: bold; padding: 2px; }
        .char-cell.name-cell { font-weight: bold; text-align: left; justify-content: flex-start; padding-left: 10px; background: rgba(194,178,128,0.08); }
        .char-cell.pending { opacity: 0; transform: scale(0.85); }
        .char-cell.flip { transform: rotateX(90deg); }
        .char-cell.correct { background: var(--correct); border-color: var(--correct); color: #06240f; font-weight: bold; }
        .char-cell.correct.pop { animation: cellPop 0.3s ease-out; }
        .char-cell.wrong { background: #3a1414; border-color: #7a2323; color: #f2b8b8; }
        .char-cell .arrow { font-size: 0.75rem; margin-left: 4px; opacity: 0.8; }
        @keyframes cellPop { 0% { transform: scale(1); } 50% { transform: scale(1.12); } 100% { transform: scale(1); } }
        .countdown-timer { font-size: 1.8rem; font-weight: bold; color: var(--sand); display: block; margin: 10px 0; letter-spacing: 2px; }
        .btn-action { background: var(--sand); color: black; border: 0; padding: 15px; border-radius: 8px; font-weight: bold; width: 100%; cursor: pointer; margin-top: 10px; font-size: 1rem; }
        .btn-next { background: var(--spice); color: white; }

        .hidden { display: none !important; }
        .shake { animation: shake 0.4s; }
        @keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-5px)} 75%{transform:translateX(5px)} }

        @media (max-width: 380px) {
            .logo { font-size: 1.4rem; letter-spacing: 3px; }
            .beta-badge { font-size: 0.5rem; padding: 1px 4px; display: block; margin: 2px auto 0; width: fit-content; }
            header { padding: 0.7rem; }
            .icon-btn { width: 30px; height: 30px; font-size: 0.9rem; }
            .header-side { min-width: 68px; gap: 0.35rem; }
            .streak-badge { font-size: 0.7rem; padding: 2px 6px; }
            .key { height: 44px; font-size: 0.8rem; }
            .key-row { gap: 3px; }
            .card { padding: 1.1rem; }
            .emoji-slot { width: 52px; height: 52px; font-size: 2rem; }
            .emoji-slots { gap: 8px; }
        }
    </style>

<body>

    <canvas id="spice-canvas"></canvas>
    <canvas id="confetti-canvas"></canvas>

    <header>
        <div class="header-side">
            <button class="icon-btn" onclick="HowTo.show()" title="Cómo jugar" aria-label="Cómo jugar">?</button>
            <button class="icon-btn" id="mute-btn" onclick="SoundManager.toggle()" title="Silenciar sonido" aria-label="Silenciar sonido">🔊</button>
            <span id="streak-badge" class="streak-badge" title="Tu racha de días jugando" onclick="GlobalStreak.showInfo()" style="cursor:pointer;">🔥0</span>
        </div>
        <h1 class="logo" onclick="Router.go('home')">DUNEDLE <span class="beta-badge">BETA v0.9</span></h1>
        <div class="header-side right">
            <div id="theme-selector-slot">
                <button class="icon-btn" onclick="FactionChoice.show(false)" title="Elegir facción" aria-label="Elegir facción">⚔️</button>
            </div>
        </div>
    </header>

    <main id="view-port"></main>

                if(!raw) return { played: 0, wins: 0, currentStreak: 0, maxStreak: 0, lastDate: null, distribution: [0,0,0,0,0,0] };
                const s = JSON.parse(raw);
                if(!s.distribution) s.distribution = [0,0,0,0,0,0];
                return s;
            },
            save(game, s) { localStorage.setItem(this.key(game), JSON.stringify(s)); },
            getTotalWins() { return this.get('wordle').wins + this.get('emoji').wins + this.get('quote').wins + this.get('character').wins + this.get('kanly').wins; },
            record(game, won, attempts) {
                const beforeTotal = this.getTotalWins();
                const s = this.get(game);
                const prevWins = s.wins;
                s.played++;
                if(won) {
                    s.wins++;
                    const gap = s.lastDate ? daysBetween(s.lastDate) : null;
                    if(gap === 1) s.currentStreak++;
                    else if(gap === 0) { /* ya contado hoy, no debería pasar */ }
                    else s.currentStreak = 1;
                    s.maxStreak = Math.max(s.maxStreak, s.currentStreak);
                    if(game === 'wordle' && attempts >= 1 && attempts <= 6) {
                        s.distribution[attempts - 1] = (s.distribution[attempts - 1] || 0) + 1;
                    }
                } else {
                    s.currentStreak = 0;
                }
                s.lastDate = todayStr();
                this.save(game, s);

                        tile.id = `t-${i}-${j}`;
                        tile.className = 'tile';
                        if(["'","-"," "].includes(this.target[j])) { tile.textContent = this.target[j]; tile.style.border="none"; }
                        else if(guess) {
                            tile.textContent = guess[j];
                            if(statuses) tile.classList.add(statuses[sPtr]);
                            sPtr++;
                        }
                        grid.appendChild(tile);
                    }
                }
                gridCont.appendChild(grid); container.appendChild(gridCont);
                if(this.state.finished) this.renderFinal(container);
                else { this.renderKeyboard(container); this.setupKeyboard(); this.updateKeyboardColors(); }
            },
            computeStatuses(fullGuess) {
                const cleanTarget = this.target.replace(/[^A-ZÑ]/g, '').split('');
                const cleanGuess = [];
                for(let i=0; i<this.target.length; i++){
                    if(!["'","-"," "].includes(this.target[i])) cleanGuess.push(fullGuess[i]);
                }
                const result = new Array(cleanGuess.length).fill('absent');
                const used = new Array(cleanTarget.length).fill(false);
                for(let i=0; i<cleanGuess.length; i++){
                    if(cleanGuess[i] === cleanTarget[i]){ result[i] = 'correct'; used[i] = true; }
                }
                for(let i=0; i<cleanGuess.length; i++){
                    if(result[i] === 'correct') continue;
                    let found = -1;
                    for(let j=0; j<cleanTarget.length; j++){
                        if(!used[j] && cleanTarget[j] === cleanGuess[i]){ found = j; break; }
                    }
                    if(found !== -1){ result[i] = 'present'; used[found] = true; }
                }
                return result;
            },
            computeKeyStates() {
                const rank = { absent: 0, present: 1, correct: 2 };
                const states = {};
                (this.state.guesses || []).forEach((g, idx) => {
                    const statuses = this.state.statuses ? this.state.statuses[idx] : null;
                    if(!statuses) return;
                    let sPtr = 0;
                    for(let i=0; i<this.target.length; i++){
                        if(["'","-"," "].includes(this.target[i])) continue;
                        const letter = g[i];
                        const st = statuses[sPtr]; sPtr++;
                        if(!states[letter] || rank[st] > rank[states[letter]]) states[letter] = st;
                    }
                });
                return states;
            },
            updateKeyboardColors() {
                const states = this.computeKeyStates();
                document.querySelectorAll('.keyboard .key').forEach(btn => {
                    const k = btn.dataset.key;
                    const st = states[k];
                    btn.classList.remove('correct', 'present', 'absent-key');
                    if(st) btn.classList.add(st === 'absent' ? 'absent-key' : st);
                });
            },
            renderKeyboard(container) {
                const layout = [["Q","W","E","R","T","Y","U","I","O","P"],["A","S","D","F","G","H","J","K","L","Ñ"],["ENTER","Z","X","C","V","B","N","M","⌫"]];
                const kb = document.createElement('div'); kb.className = 'keyboard';
                layout.forEach(rowRaw => {
                    const row = Lang.current === 'en' ? rowRaw.filter(k => k !== 'Ñ') : rowRaw;
                    const r = document.createElement('div'); r.className = 'key-row';
                    row.forEach(k => {
                        const b = document.createElement('button');
                        b.className = `key ${k.length>1?'wide':''}`; b.textContent = k;
                        b.dataset.key = k;
                        b.onclick = () => this.handleInput(k); r.appendChild(b);
                    });
                    kb.appendChild(r);
                });
                container.appendChild(kb);
            },
            setupKeyboard() {
                window.onkeydown = (e) => {
                    let k = e.key.toUpperCase();
                    if(k === "BACKSPACE") k = "⌫";
                    if(k === "ENTER" || /^[A-ZÑ]$/.test(k) || k === "⌫") this.handleInput(k);
                };
            },
            handleInput(k) {
                if(this.isSubmitting || this.state.finished) return;
                const cleanLen = this.target.replace(/[^A-ZÑ]/g, '').length;
                if(k === "ENTER") this.submit();
                else if(k === "⌫") { this.current = this.current.slice(0, -1); this.updateGrid(); }
                else if(this.current.length < cleanLen && /^[A-ZÑ]$/.test(k)) { this.current += k; this.updateGrid(); }
            },
            updateGrid() {
                const row = this.state.guesses.length;
                let cPtr = 0;
                for(let i=0; i<this.target.length; i++){
                    if(!["'","-"," "].includes(this.target[i])){
                        document.getElementById(`t-${row}-${i}`).textContent = this.current[cPtr] || "";
                        cPtr++;
                    }
                }
            },
            async submit() {
                if(this.isSubmitting || this.state.finished) return;
                const cleanTarget = this.target.replace(/[^A-ZÑ]/g, '');
                if(this.current.length !== cleanTarget.length) return;
                this.isSubmitting = true;
                let fullGuess = ""; let cPtr = 0;
                for(let i=0; i<this.target.length; i++){
                    if(["'","-"," "].includes(this.target[i])) fullGuess += this.target[i];
                    else fullGuess += this.current[cPtr++];
                }
                const rowIdx = this.state.guesses.length;
                const statuses = this.computeStatuses(fullGuess);
                this.state.guesses.push(fullGuess);
                if(!this.state.statuses) this.state.statuses = [];
                this.state.statuses.push(statuses);
                let sPtr = 0;
                for(let i=0; i<this.target.length; i++){
                    const t = document.getElementById(`t-${rowIdx}-${i}`);
                    if(["'","-"," "].includes(this.target[i])) continue;
                    const status = statuses[sPtr]; sPtr++;
                    t.classList.add('flip'); await new Promise(r => setTimeout(r, 100));
                    t.classList.add(status);
                    if(status === 'correct') { SoundManager.correct(); Haptics.correct(); }
                    else if(status === 'present') { SoundManager.present(); Haptics.present(); }
                    else { SoundManager.absent(); Haptics.absent(); }
                }
                this.updateKeyboardColors();
                if(fullGuess === this.target) { this.state.finished = true; this.state.won = true; }
                else if(this.state.guesses.length >= 6) { this.state.finished = true; this.state.won = false; }
                if(this.state.finished) {
                    setTimeout(() => {
                        if(this.state.won) { SoundManager.win(); Haptics.win(); }
                        else { SoundManager.wrong(); Haptics.wrong(); }
                    }, 350);
                }
                if(this.state.finished && !this.state.statsRecorded) {
                    StatsManager.record('wordle', this.state.won, this.state.guesses.length);
                    if(this.state.won) { FactionWar.recordWin('wordle'); GlobalStreak.recordWin(); }
                    this.state.statsRecorded = true;
                }
                Daily.saveState('wordle', this.state); this.current = "";
                this.isSubmitting = false;
                if(this.state.finished) setTimeout(() => this.render(document.getElementById('view-port')), 500);
            },
            renderFinal(container) {
                container.innerHTML += `
                    <div class="victory-panel">
                        <h2 style="color:${this.state.won?'var(--correct)':'#ef4444'}">${this.state.won?'¡Misión Cumplida!':'El desierto vence'}</h2>
                        <h1>${this.target}</h1><div class="lore-box">${this.desc}</div>
                        <button class="share-btn" onclick="WordleGame.share()">📸 Compartir resultado</button>
                        <p>Próximo reto en:</p><span class="countdown-timer">00 h 00 min 00 s</span>
                        ${renderFlowButtons('wordle')}
                    </div>
                `;
                TimerSystem.start();
                if(this.state.won) Confetti.burst();
            },
            share() { ShareCard.preview(ShareCard.wordleImage(this.state, this.target), 'dunedle-palabra.png', Share.wordleText(this.state)); }
        };

                const cells = row.cells.map(c => `<div class="char-cell ${c.status}">${c.value}${c.arrow ? ' <span class="arrow">' + c.arrow + '</span>' : ''}</div>`).join('');
                return `<div class="char-cell name-cell">${row.name}</div>${cells}`;
            },
            findCharacter(guessRaw) {
                const resolved = resolveNameGuess(guessRaw, DUNEDATA_MOVIE_CHARACTERS.map(c => c.name));
                if(!resolved) return null;
                return DUNEDATA_MOVIE_CHARACTERS.find(c => c.name === resolved) || null;
            },
            buildRow(guessed) {
                const cells = this.fields.map(f => {
                    const gv = guessed[f.key], tv = this.target[f.key];
                    if(f.numeric){
                        const status = gv === tv ? 'correct' : 'wrong';
                        return { value: formatHeight(gv), status, arrow: gv === tv ? '' : (gv > tv ? '↓' : '↑') };
                    }
                    const status = String(gv).toLowerCase() === String(tv).toLowerCase() ? 'correct' : 'wrong';
                    return { value: gv, status };
                });
                return { name: guessed.name, cells, won: guessed.name === this.target.name };
            },
            showError(msg) {
                const el = document.getElementById('c-error');
                if(!el) return;
                msg = t(msg);
                el.textContent = msg;
                setTimeout(() => { if(el.textContent === msg) el.textContent = ''; }, 2500);
            },
            revealCell(cell, c, delay) {
                return new Promise(resolve => {
                    setTimeout(() => {
                        cell.classList.add('flip');
                        setTimeout(() => {
                            cell.textContent = c.value + (c.arrow ? ' ' + c.arrow : '');
                            cell.classList.remove('flip');
                            cell.classList.add(c.status);
                            if(c.status === 'correct'){
                                cell.classList.add('pop');
                                SoundManager.correct(); Haptics.correct();
                            } else {
                                SoundManager.absent(); Haptics.absent();
                            }
                            setTimeout(resolve, 220);
                        }, 220);
                    }, delay);
                });
            },
            async check() {
                if(this.isSubmitting || this.state.finished) return;
                const input = document.getElementById('c-input');
                const val = input.value.trim();
                if(!val) return;
                const guessed = this.findCharacter(val);
                if(!guessed){ this.showError('Ese personaje no está en la base de datos.'); return; }
                if(this.state.rows.some(r => r.name === guessed.name)){ this.showError('Ya has probado con ese personaje.'); return; }

                this.isSubmitting = true;
                document.getElementById('c-sugg').style.display = 'none';
                input.value = ''; input.disabled = true;

                const row = this.buildRow(guessed);
                const grid = document.getElementById('c-grid');
                const anchor = grid.children[headersCount(this)] || null;

                const nameCell = document.createElement('div');
                nameCell.className = 'char-cell name-cell pending';
                nameCell.textContent = row.name;
                grid.insertBefore(nameCell, anchor);
                requestAnimationFrame(() => nameCell.classList.remove('pending'));
                let prev = nameCell;

                const cellEls = row.cells.map(() => {
                    const cell = document.createElement('div');
                    cell.className = 'char-cell';
                    prev.after(cell); prev = cell;
                    return cell;
                });

                await Promise.all(row.cells.map((c, i) => this.revealCell(cellEls[i], c, i * 160)));

                this.state.rows.unshift(row);
                input.disabled = false; input.focus();
                this.isSubmitting = false;

                if(row.won){
                    this.state.finished = true; this.state.won = true;
                    setTimeout(() => { SoundManager.win(); Haptics.win(); }, 150);
                } else {
                    Haptics.wrong();
                }
                if(this.state.finished && !this.state.statsRecorded){
                    StatsManager.record('character', true, this.state.rows.length);
                    FactionWar.recordWin('character'); GlobalStreak.recordWin();
                    this.state.statsRecorded = true;
                }
                Daily.saveState('character', this.state);
                if(this.state.finished) setTimeout(() => this.render(document.getElementById('view-port')), 500);
            },
            share() {
                const attempts = this.state.rows.length;
                ShareCard.preview(ShareCard.emojiImage(this.target, attempts, true), 'dunedle-quien-es.png', Share.simpleText('¿Quién es?', true, attempts));
            }
        };

        // Busca por inicio de palabra: prioriza nombres/apellidos que EMPIEZAN por lo escrito,
        // en vez de cualquier nombre que simplemente contenga esa letra en cualquier parte.
        // Quita tildes/diacríticos y pasa a minúsculas, para que "Baron" encuentre "Barón".
        // Limpia texto antes de volver a mostrarlo en la página, para que no se pueda
        // inyectar HTML/JS escribiéndolo en un cuadro de respuesta (XSS).
        function escapeHTML(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        function foldAccents(str) {
            return str.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
        }

        // Sugiere nombres cuyo nombre completo empieza por lo escrito, y también nombres
        // donde CUALQUIER palabra (nombre, apellido, título) empieza por lo escrito —
        // por ejemplo "vladimir" o "v" encuentran "Barón Vladimir Harkonnen". Ignora tildes.
        // Solo sugiere nombres que EMPIEZAN por lo escrito (no por una palabra suelta
        // dentro del nombre, como el apellido). Sí ignora tildes.
        // Títulos/tratamientos que pueden ir delante del nombre real de un personaje.
        // No activa la búsqueda por CUALQUIER palabra (eso traería de vuelta el problema
        // de "a" encontrando a todos los Atreides por el apellido) — solo permite que,
        // si el nombre completo empieza por uno de estos títulos, también valga buscar
        // por lo que viene justo después del título.
        const NAME_TITLES = ['baron', 'princesa', 'princess', 'lady', 'conde', 'count', 'shadout'];

        function smartNameSearch(names, query, limit) {
            const val = foldAccents(query.trim());
            if(!val) return [];
            const fullMatches = [];
            const titleMatches = [];
            names.forEach(n => {
                const folded = foldAccents(n);
                if(folded.startsWith(val)){ fullMatches.push(n); return; }
                const words = folded.split(/\s+/);
                if(words.length > 1 && NAME_TITLES.includes(words[0])){
                    const rest = words.slice(1).join(' ');
                    if(rest.startsWith(val)) titleMatches.push(n);
                }
            });
            return [...fullMatches, ...titleMatches].slice(0, limit || 5);
        }

        function setupNameSearch(inputId, suggId, source, onCheck) {
            const input = document.getElementById(inputId);
            const sugg = document.getElementById(suggId);
            input.oninput = () => {
                sugg.innerHTML = "";
                const matches = smartNameSearch(source, input.value, 5);
                if(matches.length){
                    sugg.style.display = "block";
                    matches.forEach(m => {
                        const d = document.createElement('div'); d.className = "suggestion-item"; d.textContent = m;
                        d.onclick = () => { input.value = m; sugg.style.display = "none"; onCheck(); };
                        sugg.appendChild(d);
                    });
                } else {
                    sugg.style.display = "none";
                }
            };
            input.onkeydown = (e) => {
                if(e.key === 'Enter'){ e.preventDefault(); sugg.style.display = "none"; onCheck(); }
            };
        }

        // Acepta el nombre completo o solo el primer nombre/palabra (ej. "Paul" para "Paul Atreides"),
        // pero solo si esa primera palabra no es ambigua entre dos entradas distintas de la lista.
        // Resuelve un nombre escrito por el usuario contra una lista de nombres válidos.
        // Acepta el nombre completo, o CUALQUIER palabra individual del nombre (no solo la primera),
        // pero solo si esa palabra no se repite en ninguna otra entrada de la lista (si no, es ambigua
        // y hay que escribir el nombre completo para desempatar).
        function resolveNameGuess(guess, names) {
            const g = foldAccents(guess.trim());
            if(!g) return null;
            const exact = names.find(n => foldAccents(n.trim()) === g);
            if(exact) return exact;
            const owners = {};
            names.forEach(n => {
                foldAccents(n.trim()).split(/[\s-]+/).forEach(word => {
                    if(!owners[word]) owners[word] = new Set();
                    owners[word].add(n);
                });
            });
            if(owners[g] && owners[g].size === 1) return [...owners[g]][0];
            return null;
        }

        function isAcceptableAnswer(guess, targetName, allNames) {
            const resolved = resolveNameGuess(guess, allNames);
            return !!resolved && resolved.trim().toLowerCase() === targetName.trim().toLowerCase();
        }

        const Spice = {

            init() {

                window.onresize = () => {
                    this.canvas.width = window.innerWidth; this.canvas.height = window.innerHeight;
                    Confetti.resize();

                for(let i=0; i<50; i++) this.p.push({x:Math.random()*this.canvas.width, y:Math.random()*this.canvas.height, s:Math.random()*2, vy:Math.random()*-0.5, o:Math.random()});
                this.animate();
            },
            animate() {
                this.ctx.clearRect(0,0,this.canvas.width, this.canvas.height);
                this.p.forEach(p => {
                    p.y += p.vy; if(p.y < 0) p.y = this.canvas.height;
                    this.ctx.fillStyle = `rgba(${this.color}, ${p.o})`;
                    this.ctx.beginPath(); this.ctx.arc(p.x, p.y, p.s, 0, Math.PI*2); this.ctx.fill();
                });

        /* --- CONFETI DE SPICE (al ganar) --- */
        const Confetti = {
            canvas: document.getElementById('confetti-canvas'), ctx: null, particles: [],
            init() { this.ctx = this.canvas.getContext('2d'); this.resize(); this.loop(); },
            resize() { this.canvas.width = window.innerWidth; this.canvas.height = window.innerHeight; },
            burst() {
                const colors = ['#c2b280', '#9d4edd', '#4ade80', '#facc15', getComputedStyle(document.documentElement).getPropertyValue('--sand')];
                for(let i=0; i<90; i++){
                    this.particles.push({
                        x: this.canvas.width / 2,
                        y: this.canvas.height / 3,
                        vx: (Math.random()-0.5) * 12,
                        vy: (Math.random()-1.2) * 12,
                        s: Math.random()*5 + 2,
                        color: colors[Math.floor(Math.random()*colors.length)],
                        life: 100
                    });
                }
            },
            loop() {
                this.ctx.clearRect(0,0,this.canvas.width, this.canvas.height);
                this.particles = this.particles.filter(p => p.life > 0);
                this.particles.forEach(p => {
                    p.vy += 0.25; p.x += p.vx; p.y += p.vy; p.life--;
                    this.ctx.globalAlpha = Math.max(p.life / 100, 0);
                    this.ctx.fillStyle = p.color;
                    this.ctx.fillRect(p.x, p.y, p.s, p.s);
                });
                this.ctx.globalAlpha = 1;
                requestAnimationFrame(() => this.loop());
            }
        };

        const SoundManager = {
            ctx: null,
            muted: false,
            init() {
                this.muted = localStorage.getItem('dunedle_muted') === '1';
                this.updateIcon();
            },
            getCtx() {
                if(!this.ctx) {
                    const AC = window.AudioContext || window.webkitAudioContext;
                    if(!AC) return null;
                    this.ctx = new AC();
                }
                if(this.ctx.state === 'suspended') this.ctx.resume();
                return this.ctx;
            },
            tone(freq, duration, type, volume, delay) {
                if(this.muted) return;
                const ctx = this.getCtx();
                if(!ctx) return;
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = type || 'sine';
                osc.frequency.value = freq;
                osc.connect(gain); gain.connect(ctx.destination);
                const start = ctx.currentTime + (delay || 0);
                gain.gain.setValueAtTime(0, start);
                gain.gain.linearRampToValueAtTime(volume || 0.1, start + 0.02);
                gain.gain.exponentialRampToValueAtTime(0.0001, start + duration);
                osc.start(start);
                osc.stop(start + duration + 0.03);
            },
            correct() { this.tone(660, 0.12, 'sine', 0.12); },
            present() { this.tone(440, 0.12, 'sine', 0.10); },
            absent() { this.tone(180, 0.10, 'sine', 0.05); },
            wrong() { this.tone(160, 0.18, 'sawtooth', 0.07); },
            win() { [523, 659, 784, 1046].forEach((f, i) => this.tone(f, 0.18, 'sine', 0.11, i * 0.09)); },
            toggle() {
                this.muted = !this.muted;
                localStorage.setItem('dunedle_muted', this.muted ? '1' : '0');
                this.updateIcon();
                if(!this.muted) this.tone(660, 0.1, 'sine', 0.1);

        /* --- ELECCIÓN DE FACCIÓN --- */
        /* --- GUERRA DE FACCIONES (ranking global vía Firebase) --- */
        const FactionWar = {
            db: null,
            deviceId: null,
            available: false,
            init() {
                try {
                    if(typeof firebase === 'undefined' || FIREBASE_CONFIG.apiKey === 'TU_API_KEY') return;
                    if(!firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);
                    this.db = firebase.database();
                    this.deviceId = this.getDeviceId();
                    this.available = true;
                } catch(e) { this.available = false; }
            },
            getDeviceId() {
                let id = localStorage.getItem('dunedle_device_id');
                if(!id){
                    id = (crypto.randomUUID ? crypto.randomUUID() : 'id-' + Date.now() + '-' + Math.random().toString(36).slice(2));
                    localStorage.setItem('dunedle_device_id', id);
                }
                return id;
            },
            monthKey() {
                const d = new Date();
                return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
            },
            daysLeftInMonth() {
                const d = new Date();
                const lastDay = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
                return lastDay - d.getDate();
            },
            async recordWin(game, instance) {
                if(!this.available) return;
                const faction = localStorage.getItem('dunedle_faction');
                if(faction !== 'atreides' && faction !== 'harkonnen') return; // sin facción elegida, no cuenta
                const today = todayStr();
                // "instance" permite que un mismo juego cuente varias veces el mismo día (p.ej. Kanly,
                // hasta 3 veces), usando un recibo distinto por cada una en vez de uno solo por día.
                const receiptId = `${this.deviceId}_${game}_${today}${instance ? '_' + instance : ''}`;
                const receiptRef = this.db.ref('factionWar/receipts/' + receiptId);
                try {
                    // Las reglas solo permiten crear este recibo si no existe ya: si esto falla,
                    // es que ya se contó este punto hoy para este juego y este dispositivo.
                    await receiptRef.set({ device: this.deviceId, game, date: today, faction });
                } catch(e) {
                    return;
                }
                try {
                    const currentMonth = this.monthKey();
                    const currentRef = this.db.ref('factionWar/current');
                    const snap = await currentRef.once('value');
                    const data = snap.val();
                    if(data && data.month && data.month !== currentMonth){
                        await this.db.ref('factionWar/history/' + data.month).set(data);
                        await currentRef.set({ atreides: 0, harkonnen: 0, month: currentMonth });
                    }
                    await currentRef.child(faction).transaction(n => (n || 0) + 1);
                    await currentRef.child('month').set(currentMonth);
                } catch(e) { /* sin conexión o Firebase no disponible: no pasa nada, el recibo ya quedó guardado */ }
            },
            async getStandings() {
                if(!this.available) return null;
                try {
                    const snap = await this.db.ref('factionWar/current').once('value');
                    return snap.val() || { atreides: 0, harkonnen: 0 };
                } catch(e) { return null; }
            },
            async getLastMonthWinner() {
                if(!this.available) return null;
                try {
                    const d = new Date(); d.setMonth(d.getMonth() - 1);
                    const prevMonth = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
                    const snap = await this.db.ref('factionWar/history/' + prevMonth).once('value');
                    const data = snap.val();
                    if(!data) return null;
                    if(data.atreides === data.harkonnen) return { tie: true };
                    return { winner: data.atreides > data.harkonnen ? 'atreides' : 'harkonnen', ...data };
                } catch(e) { return null; }
            }
        };

        /* --- MODO KANLY: duelo 1 contra 1 a contrarreloj, con matchmaking vía Firebase --- */

        let KANLY_TRIVIA = [

        const KanlyGame = {
            db: null, deviceId: null, available: false,
            matchId: null, matchRef: null, queueRef: null,
            myScore: 0, myAnswered: 0, opponentId: null,
            questions: [], qIndex: 0, timerEnd: 0, timerInterval: null, searchTimeout: null,
            onStateChange: null, // callback que usa KanlyView para re-renderizar

            init() {
                // Reutiliza la misma conexión y el mismo ID de dispositivo que la Guerra de Facciones.
                this.available = FactionWar.available;
                if(this.available){ this.db = FactionWar.db; this.deviceId = FactionWar.deviceId; }
            },

            // --- Generación de preguntas (misma semilla para los dos jugadores) ---
            seededRandom(seed) {
                let s = seed % 2147483647; if(s <= 0) s += 2147483646;
                return () => { s = (s * 16807) % 2147483647; return (s - 1) / 2147483646; };
            },
            hashString(str) {
                let h = 0;
                for(let i = 0; i < str.length; i++){ h = (Math.imul(31, h) + str.charCodeAt(i)) | 0; }
                return Math.abs(h) || 1;
            },
            buildQuestions(seed, count) {
                const rand = this.seededRandom(this.hashString(seed));
                const pool = DUNEDATA_CHARACTERS;
                const quotePool = DUNEDATA_QUOTES.filter(q => pool.some(c => c.name === q.char));

                // Cada personaje, cada frase y cada pregunta de trivia se usa como MUCHO una vez
                // por partida: se baraja cada lista entera en vez de sortear con repetición.
                const emojiQs = this.shuffle(pool, rand).map(c => {
                    const distractors = this.pickDistractors(pool.map(x => x.name), c.name, rand, 3);
                    const options = this.shuffle([c.name, ...distractors], rand);
                    return { type: 'emoji', prompt: c.emojis.join(' '), options, answer: c.name };
                });
                const quoteQs = this.shuffle(quotePool, rand).map(q => {
                    const distractors = this.pickDistractors(pool.map(c => c.name), q.char, rand, 3);
                    const options = this.shuffle([q.char, ...distractors], rand);
                    return { type: 'quote', prompt: q.text, options, answer: q.char };
                });
                const triviaQs = this.shuffle(KANLY_TRIVIA, rand).map(t => {
                    const options = this.shuffle(t.options, rand);
                    return { type: 'trivia', prompt: t.prompt, options, answer: t.answer };
                });

                // Se intercalan las tres listas ya barajadas para que los tipos se mezclen,
                // sin repetir ninguna pregunta dentro de la partida.
                const lists = [emojiQs, quoteQs, triviaQs];
                const merged = [];
                let i = 0;
                while(lists.some(l => l.length > 0)){
                    const list = lists[i % lists.length];
                    if(list.length > 0) merged.push(list.shift());
                    i++;
                }
                return merged.slice(0, count);
            },
            pickDistractors(allNames, correct, rand, n) {
                const others = allNames.filter(x => x !== correct);
                const picked = [];
                while(picked.length < n && others.length > 0){
                    const idx = Math.floor(rand() * others.length);
                    picked.push(others.splice(idx, 1)[0]);
                }
                return picked;
            },
            shuffle(arr, rand) {
                const a = arr.slice();
                for(let i = a.length - 1; i > 0; i--){
                    const j = Math.floor(rand() * (i + 1));
                    [a[i], a[j]] = [a[j], a[i]];
                }
                return a;
            },

            // --- Matchmaking ---
            async findMatch(onFound, onSearching) {
                if(!this.available) return;
                const myId = this.deviceId;
                this.matchId = null;
                // Limpia cualquier partida vieja que hubiera quedado colgada de una búsqueda
                // anterior (si no, el listener de abajo la detectaría al instante como si
                // fuera nueva, con el cronómetro ya agotado hace rato).
                try { await this.db.ref('kanly/playerMatch/' + myId).remove(); } catch(e) {}
                this.queueRef = this.db.ref('kanly/queue/' + myId);
                await this.queueRef.set({ joinedAt: firebase.database.ServerValue.TIMESTAMP });
                this.queueRef.onDisconnect().remove();

                this.db.ref('kanly/playerMatch/' + myId).on('value', async (snap) => {
                    const matchId = snap.val();
                    if(matchId && !this.matchId){
                        this.matchId = matchId;
                        this.db.ref('kanly/playerMatch/' + myId).off();
                        await this.queueRef.remove();
                        this.joinMatch(matchId, onFound);
                    }
                });

                const queueListener = this.db.ref('kanly/queue').on('value', (snap) => {
                    if(this.matchId) return;
                    const all = snap.val() || {};
                    const entries = Object.entries(all).sort((a, b) => (a[1].joinedAt || 0) - (b[1].joinedAt || 0));
                    if(entries.length < 2) return;
                    const pair = [entries[0][0], entries[1][0]].sort();
                    if(pair[0] !== myId) return; // solo el primero del par crea la partida, evita duplicados
                    const [idA, idB] = pair;
                    const newMatchId = idA + '_' + idB + '_' + Date.now();
                    this.db.ref('kanly/matches/' + newMatchId).set({
                        players: [idA, idB],
                        scores: { [idA]: 0, [idB]: 0 },
                        answered: { [idA]: 0, [idB]: 0 },
                        finished: { [idA]: false, [idB]: false },
                        seed: newMatchId,
                        startAt: firebase.database.ServerValue.TIMESTAMP
                    }).then(() => {
                        this.db.ref('kanly/playerMatch/' + idA).set(newMatchId);
                        this.db.ref('kanly/playerMatch/' + idB).set(newMatchId);
                        this.db.ref('kanly/queue/' + idA).remove();
                        this.db.ref('kanly/queue/' + idB).remove();
                    }).catch(() => {});
                });

                this.searchTimeout = setTimeout(() => { if(onSearching) onSearching(); }, 30000);
            },
            cancelSearch() {
                clearTimeout(this.searchTimeout);
                if(this.queueRef){ this.queueRef.remove(); this.queueRef.off(); }
                this.db.ref('kanly/playerMatch/' + this.deviceId).off();
                this.db.ref('kanly/queue').off();
            },
            async joinMatch(matchId, onFound) {
                clearTimeout(this.searchTimeout);
                this.db.ref('kanly/queue').off();
                const snap = await this.db.ref('kanly/matches/' + matchId).once('value');
                const data = snap.val();
                this.opponentId = data.players.find(p => p !== this.deviceId);
                this.questions = this.buildQuestions(data.seed, 200);
                this.qIndex = 0; this.myScore = 0; this.myAnswered = 0;
                this.timerEnd = data.startAt + 60000;
                this.matchRef = this.db.ref('kanly/matches/' + matchId);
                this.matchRef.on('value', (s) => { if(this.onStateChange) this.onStateChange(s.val()); });
                if(onFound) onFound();
            },
            currentQuestion() { return this.questions[this.qIndex]; },
            async answer(choice) {
                const q = this.currentQuestion();
                if(!q) return;
                const correct = choice === q.answer;
                this.myAnswered++;
                if(correct) this.myScore++;
                this.qIndex++;
                if(this.matchRef){
                    this.matchRef.child('scores/' + this.deviceId).set(this.myScore);
                    this.matchRef.child('answered/' + this.deviceId).set(this.myAnswered);
                }
                return correct;
            },
            async finishMyself() {
                if(this.matchRef) await this.matchRef.child('finished/' + this.deviceId).set(true);
            },
            leaveMatch() {
                if(this.matchRef){ this.matchRef.off(); this.matchRef = null; }
                this.matchId = null; this.opponentId = null;
            }
        };

        const KanlyView = {
            phase: 'idle', container: null, opponentData: null, timerInterval: null,

            startSearch() {

                this.renderSearching(false);
                KanlyGame.findMatch(
                    () => { this.phase = 'duel'; this.startDuel(); },
                    () => { this.renderSearching(true); }

            renderSearching(timedOut) {
                this.container.innerHTML = `
                    <div class="victory-panel">

                        <div class="kanly-spinner"></div>

                    </div>
                `;

            cancelSearch() {
                KanlyGame.cancelSearch();
                this.phase = 'idle';
                this.renderIdle();
            },

            startDuel() {
                KanlyGame.onStateChange = (data) => { this.opponentData = data; this.updateScoreboard(); };
                this.renderDuel();
                this.tick();
                this.timerInterval = setInterval(() => this.tick(), 250);
            },

            tick() {
                const remaining = Math.max(0, KanlyGame.timerEnd - Date.now());
                const secs = Math.ceil(remaining / 1000);
                const timerEl = document.getElementById('kanly-timer');
                if(timerEl){
                    timerEl.textContent = secs + 's';
                    timerEl.classList.toggle('low', secs <= 10);
                }
                if(remaining <= 0){
                    clearInterval(this.timerInterval);
                    this.endDuel();
                }
            },

            renderDuel() {
                const q = KanlyGame.currentQuestion();
                if(!q){ this.endDuel(); return; }
                const oppScore = (this.opponentData && this.opponentData.scores) ? (this.opponentData.scores[KanlyGame.opponentId] || 0) : 0;
                const promptHTML = q.type === 'emoji'
                    ? `<div class="kanly-question-emojis">${q.prompt}</div><p style="color:#999;">¿Quién es?</p>`
                    : q.type === 'quote'
                    ? `<p class="kanly-question-quote">"${q.prompt}"</p><p style="color:#999; margin-top:6px;">¿Quién lo dijo?</p>`
                    : `<p class="kanly-question-trivia">${q.prompt}</p>`;
                this.container.innerHTML = `
                    <div class="victory-panel">
                        <div class="kanly-timer" id="kanly-timer">60s</div>
                        <div class="kanly-vs">
                            <div class="kanly-player me"><div class="kanly-score" id="kanly-my-score">${KanlyGame.myScore}</div><div class="kanly-label">Tú</div></div>
                            <div class="kanly-vs-divider">VS</div>
                            <div class="kanly-player"><div class="kanly-score" id="kanly-opp-score">${oppScore}</div><div class="kanly-label">Rival</div></div>
                        </div>
                        <div class="kanly-question-box">${promptHTML}</div>
                        <div class="kanly-options" id="kanly-options">
                            ${q.options.map(opt => `<button class="kanly-option" onclick="KanlyView.pick(this, '${opt.replace(/'/g, "\\'")}')">${opt}</button>`).join('')}
                        </div>
                    </div>
                `;
            },

            async pick(btn, choice) {
                document.querySelectorAll('.kanly-option').forEach(b => { b.onclick = null; });
                const q = KanlyGame.currentQuestion();
                const correct = await KanlyGame.answer(choice);
                btn.classList.add(correct ? 'correct' : 'wrong');
                if(!correct){
                    document.querySelectorAll('.kanly-option').forEach(b => { if(b.textContent === q.answer) b.classList.add('correct'); });
                }
                if(correct){ SoundManager.correct(); Haptics.correct(); }
                else { SoundManager.absent(); Haptics.absent(); }
                setTimeout(() => {
                    if(KanlyGame.timerEnd - Date.now() <= 0){ this.endDuel(); return; }
                    this.renderDuel();
                }, 450);
            },

            updateScoreboard() {
                if(!this.opponentData || !this.opponentData.scores) return;
                const oppScore = this.opponentData.scores[KanlyGame.opponentId] || 0;
                const el = document.getElementById('kanly-opp-score');
                if(el) el.textContent = oppScore;
            },

            endDuel() {
                clearInterval(this.timerInterval);
                KanlyGame.finishMyself();
                const myScore = KanlyGame.myScore;
                const oppScore = (this.opponentData && this.opponentData.scores) ? (this.opponentData.scores[KanlyGame.opponentId] || 0) : 0;
                let resultClass = 'tie', resultText = '¡Empate!';
                if(myScore > oppScore){
                    resultClass = 'win'; resultText = '¡Has ganado el duelo!';
                    SoundManager.win(); Haptics.win(); Confetti.burst();
                    StatsManager.record('kanly', true, myScore);
                    KanlyDaily.recordWin();
                }
                else if(myScore < oppScore){ resultClass = 'lose'; resultText = 'Has perdido el duelo'; SoundManager.wrong(); Haptics.wrong(); }
                else { SoundManager.win(); }
                this.container.innerHTML = `
                    <div class="victory-panel">
                        <h2 class="kanly-result-title ${resultClass}">${resultText}</h2>
                        <div class="kanly-vs" style="margin-top:20px;">

                            <div class="kanly-vs-divider">VS</div>
                            <div class="kanly-player"><div class="kanly-score">${oppScore}</div><div class="kanly-label">Rival</div></div>
                        </div>

                        <button class="btn-action" style="background:transparent; border:1px solid var(--border-metal); color:#999;" onclick="Router.go('home')">INICIO</button>
                    </div>
                `;
                KanlyGame.leaveMatch();
            },

            playAgain() {
                this.render(this.container);
                this.startSearch();
            }
        };
