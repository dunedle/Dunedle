<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DUNEDLE</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="favicon-32.png">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <meta name="theme-color" content="#0a0a0a">

    <style>
        :root {
            --sand: #c2b280;
            --sand-dark: #8e7d50;
            --spice: #9d4edd;
            --bg-black: #0a0a0a;
            --panel-gray: #1a1a1a;
            --text-white: #e0e0e0;
            --correct: #4ade80;
            --present: #facc15;
            --absent: #3f3f46;
            --border-metal: #4a4a4a;
            --tile-size: clamp(45px, 9vw, 65px);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }

        body { transition: background-color 0.4s; }
        .logo, .card h2, .btn-action { transition: color 0.4s, background-color 0.4s, border-color 0.4s; }

        body {
            background-color: var(--bg-black);
            color: var(--text-white);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        #spice-canvas { position: fixed; top: 0; left: 0; z-index: -1; pointer-events: none; }

        header {
            position: sticky;
            top: 0;
            padding: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--border-metal);
            background: rgba(10, 10, 10, 0.9);
            backdrop-filter: blur(5px);
            z-index: 100;
            gap: 0.5rem;
        }

        .logo { color: var(--sand); letter-spacing: 5px; font-weight: 900; cursor: pointer; font-size: 1.8rem; text-shadow: 0 0 10px rgba(194, 178, 128, 0.3); }
        .beta-badge {
            display: inline-block; vertical-align: middle; margin-left: 4px;
            font-size: 0.55rem; letter-spacing: 1px; font-weight: bold;
            color: var(--bg-black); background: var(--sand);
            padding: 2px 6px; border-radius: 6px; text-shadow: none;
        }

        .header-side { display: flex; align-items: center; gap: 0.5rem; min-width: 90px; }
        .header-side.right { justify-content: flex-end; }
        .icon-btn {
            background: transparent; border: 1px solid var(--border-metal); color: var(--sand);
            width: 34px; height: 34px; border-radius: 50%; cursor: pointer;
            display: flex; align-items: center; justify-content: center; font-size: 1rem;
        }
        .icon-btn:hover { border-color: var(--sand); }

        .faction-choice-row { display: flex; gap: 16px; justify-content: center; margin: 20px 0; }
        .faction-btn {
            background: rgba(0,0,0,0.3); border: 2px solid var(--border-metal); border-radius: 12px;
            padding: 18px 20px; display: flex; flex-direction: column; align-items: center; gap: 8px;
            cursor: pointer; color: var(--text-white); font-weight: bold; flex: 1; max-width: 140px;
            font-size: 0.9rem;
        }
        .faction-btn:hover { border-color: var(--sand); }
        .faction-emoji { font-size: 2.6rem; }
        .faction-clear-link { display: block; margin: 12px auto 0; background: none; border: none; color: #888; text-decoration: underline; font-size: 0.8rem; cursor: pointer; }
        .faction-emblem-btn { font-size: 1.2rem; }

        /* --- Modal --- */
        .modal-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.75);
            display: flex; align-items: center; justify-content: center;
            z-index: 200; padding: 1rem; backdrop-filter: blur(3px);
        }
        .modal-box {
            background: linear-gradient(145deg, var(--panel-gray), #111);
            border: 2px solid var(--border-metal); border-radius: 12px;
            padding: 1.5rem; max-width: 480px; width: 100%; max-height: 85vh; overflow-y: auto;
        }
        .modal-box h2 { color: var(--sand); margin-bottom: 0.8rem; }
        .modal-box h3 { color: var(--sand); margin: 1rem 0 0.3rem; font-size: 1rem; }
        .modal-box p { line-height: 1.5; margin-bottom: 0.4rem; font-size: 0.95rem; }
        .modal-legend { display: flex; gap: 10px; margin: 0.5rem 0; flex-wrap: wrap; }
        .modal-legend span { display: flex; align-items: center; gap: 5px; font-size: 0.85rem; }
        .legend-box { width: 16px; height: 16px; border-radius: 3px; display: inline-block; }

        .share-btn {
            background: transparent; border: 2px solid var(--sand); color: var(--sand);
            padding: 12px; border-radius: 8px; font-weight: bold; width: 100%;
            cursor: pointer; margin-top: 10px; font-size: 1rem;
        }
        .share-btn:active { background: rgba(194,178,128,0.15); }

        #confetti-canvas { position: fixed; top: 0; left: 0; z-index: 300; pointer-events: none; }

        #view-port {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 1rem;
            padding-bottom: 2.5rem;
        }

        /* --- Menú Principal --- */
        .home-menu { display: flex; flex-direction: column; gap: 1rem; width: 100%; max-width: 500px; padding-top: 1rem; }
        .disclaimer { font-size: 0.7rem; line-height: 1.4; color: #666; text-align: center; margin-top: 20px; padding: 0 10px 20px; }
        .feedback-box {
            margin-top: 24px; padding: 16px; text-align: center;
            background: rgba(194,178,128,0.06); border: 1px solid var(--border-metal); border-radius: 10px;
        }
        .feedback-box p { font-size: 0.82rem; color: #aaa; margin-bottom: 8px; }
        .feedback-link { display: inline-block; color: var(--sand); font-weight: bold; font-size: 0.9rem; text-decoration: none; border-bottom: 1px solid var(--sand); padding-bottom: 2px; }
        .feedback-link:hover { opacity: 0.8; }
        .card {
            background: linear-gradient(145deg, var(--panel-gray), #111);
            border: 2px solid var(--border-metal);
            padding: 1.5rem;
            border-radius: 12px;
            cursor: pointer;
            position: relative;
            transition: 0.3s;
        }
        .card:hover { border-color: var(--sand); }
        .card h2 { color: var(--sand); margin-bottom: 0.3rem; font-size: 1.4rem; }
        .status-badge { position: absolute; top: 15px; right: 15px; font-size: 1.2rem; }

        /* --- Wordle Board --- */
        .grid-container { width: 100%; display: flex; justify-content: center; padding: 10px 0; overflow-x: auto; }
        .grid { display: grid; gap: 8px; width: fit-content; }
        .tile {
            width: var(--tile-size); height: var(--tile-size);
            border: 2px solid var(--border-metal);
            display: flex; justify-content: center; align-items: center;
            font-size: 1.5rem; font-weight: bold; text-transform: uppercase;
            background: rgba(0,0,0,0.5); perspective: 1000px;
        }

        .tile.flip { animation: flip-cell 0.6s ease-in-out forwards; }
        @keyframes flip-cell {
            0% { transform: rotateX(0deg); }
            50% { transform: rotateX(90deg); background: var(--absent); }
            100% { transform: rotateX(0deg); }
        }

        .tile.correct { background: var(--correct); border-color: var(--correct); }
        .tile.present { background: var(--present); border-color: var(--present); color: black; }
        .tile.absent { background: var(--absent); border-color: var(--absent); }

        /* --- Historial --- */
        .history-container { width: 100%; max-width: 400px; margin-top: 20px; }
        .history-item { 
            padding: 10px; margin-bottom: 5px; border-radius: 6px; 
            display: flex; justify-content: space-between;
            animation: slideIn 0.3s ease-out;
        }
        .history-wrong { background: rgba(239, 68, 68, 0.15); border-left: 4px solid #ef4444; color: #ef4444; }
        .history-correct { background: rgba(74, 222, 128, 0.15); border-left: 4px solid var(--correct); color: var(--correct); }

        @keyframes slideIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* --- Teclado --- */
        .keyboard { width: 100%; max-width: 600px; padding: 10px; margin-top: auto; }
        .key-row { display: flex; justify-content: center; gap: 4px; margin-bottom: 6px; }
        .key {
            height: 50px; border-radius: 4px; background: var(--absent); color: white;
            border: 0; flex: 1; font-weight: bold; cursor: pointer; font-size: 0.9rem;
            display: flex; justify-content: center; align-items: center;
        }
        .key.wide { flex: 1.5; }
        .key.correct { background: var(--correct); color: black; }
        .key.present { background: var(--present); color: black; }
        .key.absent-key { background: #222; color: #555; }

        /* --- UI Comprobación --- */
        .input-group { position: relative; width: 100%; max-width: 400px; margin: 20px 0; }
        input[type="text"] {
            width: 100%; padding: 15px; background: var(--panel-gray);
            border: 2px solid var(--border-metal); color: white; border-radius: 8px; font-size: 1.1rem;
        }
        .suggestions {
            position: absolute; top: 100%; left: 0; right: 0;
            background: #222; border: 1px solid var(--spice); border-radius: 8px; z-index: 100; display: none;
        }
        .suggestion-item { padding: 12px; cursor: pointer; border-bottom: 1px solid #333; }
        .suggestion-item:hover { background: var(--spice); }

        /* --- Paneles Finales --- */
        .victory-panel { text-align: center; padding: 1.5rem; width: 100%; max-width: 500px; animation: slideIn 0.5s; }
        .lore-box { background: rgba(0,0,0,0.3); padding: 15px; border-radius: 8px; text-align: left; margin: 15px 0; border-left: 4px solid var(--sand); line-height: 1.5; }
        .meta-tags { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin: 10px 0 15px; }
        .meta-tag { background: rgba(194,178,128,0.12); border: 1px solid var(--border-metal); color: var(--sand); font-size: 0.78rem; padding: 4px 10px; border-radius: 20px; }

        .achv-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; margin: 10px 0 20px; }
        .achv-badge {
            background: rgba(0,0,0,0.3); border: 1px solid var(--border-metal); border-radius: 10px;
            padding: 14px 10px; text-align: center; opacity: 0.55; filter: grayscale(0.6);
        }
        .achv-badge.unlocked { opacity: 1; filter: none; border-color: var(--sand); background: rgba(194,178,128,0.08); }
        .achv-icon { font-size: 1.8rem; margin-bottom: 6px; }
        .achv-title { font-weight: bold; font-size: 0.85rem; color: var(--sand); margin-bottom: 3px; }
        .achv-desc { font-size: 0.7rem; color: #999; line-height: 1.3; margin-bottom: 8px; min-height: 28px; }
        .achv-progress { background: #222; border-radius: 6px; height: 6px; overflow: hidden; }
        .achv-progress-fill { height: 100%; background: var(--correct); }
        .achv-count { font-size: 0.7rem; color: #888; margin-top: 4px; }

        .achv-toast {
            position: fixed; top: -100px; left: 50%; transform: translateX(-50%);
            background: linear-gradient(145deg, var(--panel-gray), #111); border: 2px solid var(--sand);
            border-radius: 12px; padding: 12px 20px; display: flex; align-items: center; gap: 12px;
            z-index: 400; box-shadow: 0 8px 24px rgba(0,0,0,0.5); transition: top 0.4s ease;
            max-width: 90vw;
        }
        .achv-toast.show { top: 16px; }
        .achv-toast-icon { font-size: 1.8rem; }
        .achv-toast-label { font-size: 0.7rem; color: var(--sand); letter-spacing: 0.5px; text-transform: uppercase; }
        .achv-toast-title { font-weight: bold; color: var(--text-white); }

        .char-table-wrap { width: 100%; overflow-x: auto; margin: 15px 0; padding-bottom: 8px; }
        .char-grid { display: inline-grid; grid-auto-flow: row; grid-template-columns: 130px repeat(6, 100px); gap: 6px; min-width: 100%; }
        .char-cell {
            background: var(--panel-gray); border: 2px solid var(--border-metal); border-radius: 8px;
            padding: 10px 6px; text-align: center; font-size: 0.75rem; line-height: 1.25;
            transition: transform 0.22s ease-in, background-color 0.15s, border-color 0.15s, opacity 0.25s;
            word-break: break-word; display: flex; align-items: center; justify-content: center;
            transform: scale(1) rotateX(0deg); opacity: 1;
        }
        .char-cell.header-cell { background: transparent; border: none; color: var(--sand); font-size: 0.68rem; text-transform: uppercase; font-weight: bold; padding: 2px; }
        .char-cell.name-cell { font-weight: bold; text-align: left; justify-content: flex-start; padding-left: 10px; background: rgba(194,178,128,0.08); }
        .char-cell.pending { opacity: 0; transform: scale(0.85); }
        .char-cell.flip { transform: rotateX(90deg); }
        .char-cell.correct { background: var(--correct); border-color: var(--correct); color: #06240f; font-weight: bold; }
        .char-cell.correct.pop { animation: cellPop 0.3s ease-out; }
        .char-cell.wrong { background: #3a1414; border-color: #7a2323; color: #f2b8b8; }
        .char-cell .arrow { font-size: 0.75rem; margin-left: 4px; opacity: 0.8; }
        @keyframes cellPop { 0% { transform: scale(1); } 50% { transform: scale(1.12); } 100% { transform: scale(1); } }
        .countdown-timer { font-size: 1.8rem; font-weight: bold; color: var(--sand); display: block; margin: 10px 0; letter-spacing: 2px; }
        .btn-action { background: var(--sand); color: black; border: 0; padding: 15px; border-radius: 8px; font-weight: bold; width: 100%; cursor: pointer; margin-top: 10px; font-size: 1rem; }
        .btn-next { background: var(--spice); color: white; }

        .hidden { display: none !important; }
        .shake { animation: shake 0.4s; }
        @keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-5px)} 75%{transform:translateX(5px)} }

        @media (max-width: 380px) {
            .logo { font-size: 1.4rem; letter-spacing: 3px; }
            .beta-badge { font-size: 0.5rem; padding: 1px 4px; display: block; margin: 2px auto 0; width: fit-content; }
            header { padding: 0.7rem; }
            .icon-btn { width: 30px; height: 30px; font-size: 0.9rem; }
            .header-side { min-width: 68px; gap: 0.35rem; }
            .key { height: 44px; font-size: 0.8rem; }
            .key-row { gap: 3px; }
            .card { padding: 1.1rem; }
        }
    </style>

                const next = new Date(now);
                next.setHours(24, 0, 0, 0);
                const diff = next - now;
                if (diff <= 0) { location.reload(); return; }
                const h = String(Math.floor(diff / 3600000)).padStart(2, '0');
                const m = String(Math.floor((diff % 3600000) / 60000)).padStart(2, '0');
                const s = String(Math.floor((diff % 60000) / 1000)).padStart(2, '0');

        /* --- WORDLE --- */
        const WordleGame = {
            target: "", desc: "", state: null, current: "", isSubmitting: false,
            init(container) {
                const data = DUNEDATA_WORDS[Daily.getIndex(DUNEDATA_WORDS)];
                this.target = data.word.toUpperCase();
                this.desc = data.desc;
                this.state = Daily.getState('wordle');
                if(!this.state.guesses) this.state.guesses = [];
                this.render(container);
            },
            render(container) {
                container.innerHTML = `<h2 style="margin-bottom:1rem; color:var(--sand)">PALABRA DEL DÍA</h2>`;
                const gridCont = document.createElement('div');
                gridCont.className = 'grid-container';
                const grid = document.createElement('div');
                grid.className = 'grid';
                grid.style.gridTemplateColumns = `repeat(${this.target.length}, 1fr)`;
                const availableWidth = Math.min(document.documentElement.clientWidth - 32, 500);
                const gap = this.target.length > 8 ? 5 : 8;
                grid.style.gap = gap + 'px';
                const rawSize = (availableWidth - gap * (this.target.length - 1)) / this.target.length;
                const tileSize = Math.max(20, Math.min(65, rawSize));
                grid.style.setProperty('--tile-size', tileSize + 'px');
                for(let i=0; i<6; i++) {
                    const guess = this.state.guesses[i] || "";
                    const statuses = (this.state.statuses && this.state.statuses[i]) || null;
                    let sPtr = 0;
                    for(let j=0; j<this.target.length; j++) {
                        const tile = document.createElement('div');
                        tile.id = `t-${i}-${j}`;
                        tile.className = 'tile';
                        if(["'","-"," "].includes(this.target[j])) { tile.textContent = this.target[j]; tile.style.border="none"; }
                        else if(guess) {
                            tile.textContent = guess[j];
                            if(statuses) tile.classList.add(statuses[sPtr]);
                            sPtr++;
                        }
                        grid.appendChild(tile);
                    }
                }
                gridCont.appendChild(grid); container.appendChild(gridCont);
                if(this.state.finished) this.renderFinal(container);
                else { this.renderKeyboard(container); this.setupKeyboard(); this.updateKeyboardColors(); }
            },
            computeStatuses(fullGuess) {
                const cleanTarget = this.target.replace(/[^A-ZÑ]/g, '').split('');
                const cleanGuess = [];
                for(let i=0; i<this.target.length; i++){
                    if(!["'","-"," "].includes(this.target[i])) cleanGuess.push(fullGuess[i]);
                }
                const result = new Array(cleanGuess.length).fill('absent');
                const used = new Array(cleanTarget.length).fill(false);
                for(let i=0; i<cleanGuess.length; i++){
                    if(cleanGuess[i] === cleanTarget[i]){ result[i] = 'correct'; used[i] = true; }
                }
                for(let i=0; i<cleanGuess.length; i++){
                    if(result[i] === 'correct') continue;
                    let found = -1;
                    for(let j=0; j<cleanTarget.length; j++){
                        if(!used[j] && cleanTarget[j] === cleanGuess[i]){ found = j; break; }
                    }
                    if(found !== -1){ result[i] = 'present'; used[found] = true; }
                }
                return result;
            },
            computeKeyStates() {
                const rank = { absent: 0, present: 1, correct: 2 };
                const states = {};
                (this.state.guesses || []).forEach((g, idx) => {
                    const statuses = this.state.statuses ? this.state.statuses[idx] : null;
                    if(!statuses) return;
                    let sPtr = 0;
                    for(let i=0; i<this.target.length; i++){
                        if(["'","-"," "].includes(this.target[i])) continue;
                        const letter = g[i];
                        const st = statuses[sPtr]; sPtr++;
                        if(!states[letter] || rank[st] > rank[states[letter]]) states[letter] = st;
                    }
                });
                return states;
            },
            updateKeyboardColors() {
                const states = this.computeKeyStates();
                document.querySelectorAll('.keyboard .key').forEach(btn => {
                    const k = btn.dataset.key;
                    const st = states[k];
                    btn.classList.remove('correct', 'present', 'absent-key');
                    if(st) btn.classList.add(st === 'absent' ? 'absent-key' : st);
                });
            },
            renderKeyboard(container) {
                const layout = [["Q","W","E","R","T","Y","U","I","O","P"],["A","S","D","F","G","H","J","K","L","Ñ"],["ENTER","Z","X","C","V","B","N","M","⌫"]];
                const kb = document.createElement('div'); kb.className = 'keyboard';
                layout.forEach(row => {
                    const r = document.createElement('div'); r.className = 'key-row';
                    row.forEach(k => {
                        const b = document.createElement('button');
                        b.className = `key ${k.length>1?'wide':''}`; b.textContent = k;
                        b.dataset.key = k;
                        b.onclick = () => this.handleInput(k); r.appendChild(b);
                    });
                    kb.appendChild(r);
                });
                container.appendChild(kb);
            },
            setupKeyboard() {
                window.onkeydown = (e) => {
                    let k = e.key.toUpperCase();
                    if(k === "BACKSPACE") k = "⌫";
                    if(k === "ENTER" || /^[A-ZÑ]$/.test(k) || k === "⌫") this.handleInput(k);
                };
            },
            handleInput(k) {
                if(this.isSubmitting || this.state.finished) return;
                const cleanLen = this.target.replace(/[^A-ZÑ]/g, '').length;
                if(k === "ENTER") this.submit();
                else if(k === "⌫") { this.current = this.current.slice(0, -1); this.updateGrid(); }
                else if(this.current.length < cleanLen && /^[A-ZÑ]$/.test(k)) { this.current += k; this.updateGrid(); }
            },
            updateGrid() {
                const row = this.state.guesses.length;
                let cPtr = 0;
                for(let i=0; i<this.target.length; i++){
                    if(!["'","-"," "].includes(this.target[i])){
                        document.getElementById(`t-${row}-${i}`).textContent = this.current[cPtr] || "";
                        cPtr++;
                    }
                }
            },
            async submit() {
                if(this.isSubmitting || this.state.finished) return;
                const cleanTarget = this.target.replace(/[^A-ZÑ]/g, '');
                if(this.current.length !== cleanTarget.length) return;
                this.isSubmitting = true;
                let fullGuess = ""; let cPtr = 0;
                for(let i=0; i<this.target.length; i++){
                    if(["'","-"," "].includes(this.target[i])) fullGuess += this.target[i];
                    else fullGuess += this.current[cPtr++];
                }
                const rowIdx = this.state.guesses.length;
                const statuses = this.computeStatuses(fullGuess);
                this.state.guesses.push(fullGuess);
                if(!this.state.statuses) this.state.statuses = [];
                this.state.statuses.push(statuses);
                let sPtr = 0;
                for(let i=0; i<this.target.length; i++){
                    const t = document.getElementById(`t-${rowIdx}-${i}`);
                    if(["'","-"," "].includes(this.target[i])) continue;
                    const status = statuses[sPtr]; sPtr++;
                    t.classList.add('flip'); await new Promise(r => setTimeout(r, 100));
                    t.classList.add(status);
                    if(status === 'correct') { SoundManager.correct(); Haptics.correct(); }
                    else if(status === 'present') { SoundManager.present(); Haptics.present(); }
                    else { SoundManager.absent(); Haptics.absent(); }
                }
                this.updateKeyboardColors();
                if(fullGuess === this.target) { this.state.finished = true; this.state.won = true; }
                else if(this.state.guesses.length >= 6) { this.state.finished = true; this.state.won = false; }
                if(this.state.finished) {
                    setTimeout(() => {
                        if(this.state.won) { SoundManager.win(); Haptics.win(); }
                        else { SoundManager.wrong(); Haptics.wrong(); }
                    }, 350);
                }
                if(this.state.finished && !this.state.statsRecorded) {
                    StatsManager.record('wordle', this.state.won, this.state.guesses.length);
                    if(this.state.won) FactionWar.recordWin('wordle');
                    this.state.statsRecorded = true;
                }
                Daily.saveState('wordle', this.state); this.current = "";
                this.isSubmitting = false;
                if(this.state.finished) setTimeout(() => this.render(document.getElementById('view-port')), 500);
            },
            renderFinal(container) {
                container.innerHTML += `
                    <div class="victory-panel">
                        <h2 style="color:${this.state.won?'var(--correct)':'#ef4444'}">${this.state.won?'¡Misión Cumplida!':'El desierto vence'}</h2>
                        <h1>${this.target}</h1><div class="lore-box">${this.desc}</div>
                        <button class="share-btn" onclick="WordleGame.share()">📸 Compartir resultado</button>
                        <p>Próximo reto en:</p><span class="countdown-timer">00 h 00 min 00 s</span>
                        ${renderFlowButtons('wordle')}
                    </div>
                `;
                TimerSystem.start();
                if(this.state.won) Confetti.burst();
            },
            share() { ShareCard.preview(ShareCard.wordleImage(this.state, this.target), 'dunedle-palabra.png', Share.wordleText(this.state)); }
        };

        /* --- EMOJIS --- */
        const EmojiGame = {
            target: null, state: null,
            init(container) {
                this.target = DUNEDATA_CHARACTERS[Daily.getIndex(DUNEDATA_CHARACTERS)];
                this.state = Daily.getState('emoji'); this.render(container);
            },
            render(container) {

                            ${renderFlowButtons('emoji')}
                        </div>
                    `;
                    TimerSystem.start(); Confetti.burst(); return;
                }
                container.innerHTML = `
                    <div class="victory-panel">
                        <h2>PERSONAJE DEL DÍA</h2>

                        <div class="input-group" style="margin:0 auto"><input type="text" id="e-input" placeholder="Nombre..." autocomplete="off"><div id="e-sugg" class="suggestions"></div></div>
                        <button class="btn-action" onclick="EmojiGame.check()">COMPROBAR</button>

                    </div>
                `;
                this.setupSearch();
            },
            setupSearch() {
                setupNameSearch('e-input', 'e-sugg', DUNEDATA_CHARACTERS.map(c => c.name), () => this.check());
            },
            check() {
                const val = document.getElementById('e-input').value.trim();
                if(!val) return;
                if(isAcceptableAnswer(val, this.target.name, DUNEDATA_CHARACTERS.map(c => c.name))){
                    this.state.finished = true; this.state.won = true;
                    SoundManager.win(); Haptics.win();
                } else {
                    this.state.history.unshift(val);
                    SoundManager.wrong(); Haptics.wrong();
                }
                if(this.state.finished && !this.state.statsRecorded) {
                    StatsManager.record('emoji', true, this.state.history.length + 1);
                    FactionWar.recordWin('emoji');
                    this.state.statsRecorded = true;
                }
                Daily.saveState('emoji', this.state); this.render(document.getElementById('view-port'));
            },
            share() {
                const attempts = this.state.history.length + 1;
                ShareCard.preview(ShareCard.emojiImage(this.target, attempts, true), 'dunedle-personaje.png', Share.simpleText('Personaje del día', true, attempts));

        /* --- FRASES --- */
        const QuoteGame = {
            target: null, state: null,
            init(container) {

            },
            render(container) {

            buildRow(guessed) {

                    if(f.numeric){

                    }

            revealCell(cell, c, delay) {
                return new Promise(resolve => {
                    setTimeout(() => {
                        cell.classList.add('flip');

                            cell.textContent = c.value + (c.arrow ? ' ' + c.arrow : '');

                            } else {

                            setTimeout(resolve, 220);

            async check() {

        // Busca por inicio de palabra: prioriza nombres/apellidos que EMPIEZAN por lo escrito,
        // en vez de cualquier nombre que simplemente contenga esa letra en cualquier parte.
        function smartNameSearch(names, query, limit) {
            const val = query.toLowerCase().trim();
            if(!val) return [];
            const fullMatches = [];
            const wordMatches = [];
            names.forEach(n => {
                const lower = n.toLowerCase();
                if(lower.startsWith(val)) fullMatches.push(n);
                else if(lower.split(/[\s-]+/).some(w => w.startsWith(val))) wordMatches.push(n);
            });
            return [...fullMatches, ...wordMatches].slice(0, limit || 5);
        }

        function setupNameSearch(inputId, suggId, source, onCheck) {
            const input = document.getElementById(inputId);
            const sugg = document.getElementById(suggId);
            input.oninput = () => {
                sugg.innerHTML = "";
                const matches = smartNameSearch(source, input.value, 5);
                if(matches.length){
                    sugg.style.display = "block";
                    matches.forEach(m => {
                        const d = document.createElement('div'); d.className = "suggestion-item"; d.textContent = m;
                        d.onclick = () => { input.value = m; sugg.style.display = "none"; onCheck(); };
                        sugg.appendChild(d);
                    });
                } else {
                    sugg.style.display = "none";
                }
            };
            input.onkeydown = (e) => {
                if(e.key === 'Enter'){ e.preventDefault(); sugg.style.display = "none"; onCheck(); }
            };
        }

        // Acepta el nombre completo o solo el primer nombre/palabra (ej. "Paul" para "Paul Atreides"),
        // pero solo si esa primera palabra no es ambigua entre dos entradas distintas de la lista.
        // Resuelve un nombre escrito por el usuario contra una lista de nombres válidos.
        // Acepta el nombre completo, o CUALQUIER palabra individual del nombre (no solo la primera),
        // pero solo si esa palabra no se repite en ninguna otra entrada de la lista (si no, es ambigua
        // y hay que escribir el nombre completo para desempatar).
        function resolveNameGuess(guess, names) {
            const g = guess.trim().toLowerCase();
            if(!g) return null;
            const exact = names.find(n => n.trim().toLowerCase() === g);
            if(exact) return exact;
            const owners = {};
            names.forEach(n => {
                n.trim().toLowerCase().split(/[\s-]+/).forEach(word => {
                    if(!owners[word]) owners[word] = new Set();
                    owners[word].add(n);
                });
            });
            if(owners[g] && owners[g].size === 1) return [...owners[g]][0];
            return null;
        }

        function isAcceptableAnswer(guess, targetName, allNames) {
            const resolved = resolveNameGuess(guess, allNames);
            return !!resolved && resolved.trim().toLowerCase() === targetName.trim().toLowerCase();
        }

        const Spice = {

            color: '157, 78, 221',
            init() {
                this.ctx = this.canvas.getContext('2d');
                window.onresize = () => {
                    this.canvas.width = window.innerWidth; this.canvas.height = window.innerHeight;
                    Confetti.resize();
                };
                window.onresize();
                for(let i=0; i<50; i++) this.p.push({x:Math.random()*this.canvas.width, y:Math.random()*this.canvas.height, s:Math.random()*2, vy:Math.random()*-0.5, o:Math.random()});
                this.animate();
            },
            animate() {
                this.ctx.clearRect(0,0,this.canvas.width, this.canvas.height);
                this.p.forEach(p => {
                    p.y += p.vy; if(p.y < 0) p.y = this.canvas.height;
                    this.ctx.fillStyle = `rgba(${this.color}, ${p.o})`;
                    this.ctx.beginPath(); this.ctx.arc(p.x, p.y, p.s, 0, Math.PI*2); this.ctx.fill();
                });
                requestAnimationFrame(() => this.animate());
            }
        };

        /* --- CONFETI DE SPICE (al ganar) --- */
        const Confetti = {
            canvas: document.getElementById('confetti-canvas'), ctx: null, particles: [],
            init() { this.ctx = this.canvas.getContext('2d'); this.resize(); this.loop(); },
            resize() { this.canvas.width = window.innerWidth; this.canvas.height = window.innerHeight; },
            burst() {
                const colors = ['#c2b280', '#9d4edd', '#4ade80', '#facc15', getComputedStyle(document.documentElement).getPropertyValue('--sand')];
                for(let i=0; i<90; i++){
                    this.particles.push({
                        x: this.canvas.width / 2,
                        y: this.canvas.height / 3,
                        vx: (Math.random()-0.5) * 12,
                        vy: (Math.random()-1.2) * 12,
                        s: Math.random()*5 + 2,
                        color: colors[Math.floor(Math.random()*colors.length)],
                        life: 100
                    });
                }
            },
            loop() {
                this.ctx.clearRect(0,0,this.canvas.width, this.canvas.height);
                this.particles = this.particles.filter(p => p.life > 0);
                this.particles.forEach(p => {
                    p.vy += 0.25; p.x += p.vx; p.y += p.vy; p.life--;
                    this.ctx.globalAlpha = Math.max(p.life / 100, 0);
                    this.ctx.fillStyle = p.color;
                    this.ctx.fillRect(p.x, p.y, p.s, p.s);
                });
                this.ctx.globalAlpha = 1;
                requestAnimationFrame(() => this.loop());
            }
        };

        const Haptics = {
            supported: typeof navigator !== 'undefined' && 'vibrate' in navigator,
            tap(pattern) {
                if(!this.supported) return;
                try { navigator.vibrate(pattern); } catch(e) {}
            },
            correct() { this.tap(12); },
            present() { this.tap(8); },
            absent() { this.tap(4); },
            win() { this.tap([20, 30, 20, 30, 50]); },
            wrong() { this.tap([15, 40, 15]); }

        const SoundManager = {
            ctx: null,
            muted: false,
            init() {
                this.muted = localStorage.getItem('dunedle_muted') === '1';
                this.updateIcon();
            },
            getCtx() {
                if(!this.ctx) {
                    const AC = window.AudioContext || window.webkitAudioContext;
                    if(!AC) return null;
                    this.ctx = new AC();
                }
                if(this.ctx.state === 'suspended') this.ctx.resume();
                return this.ctx;
            },
            tone(freq, duration, type, volume, delay) {
                if(this.muted) return;
                const ctx = this.getCtx();
                if(!ctx) return;
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = type || 'sine';
                osc.frequency.value = freq;
                osc.connect(gain); gain.connect(ctx.destination);
                const start = ctx.currentTime + (delay || 0);
                gain.gain.setValueAtTime(0, start);
                gain.gain.linearRampToValueAtTime(volume || 0.1, start + 0.02);
                gain.gain.exponentialRampToValueAtTime(0.0001, start + duration);
                osc.start(start);
                osc.stop(start + duration + 0.03);
            },
            correct() { this.tone(660, 0.12, 'sine', 0.12); },
            present() { this.tone(440, 0.12, 'sine', 0.10); },
            absent() { this.tone(180, 0.10, 'sine', 0.05); },
            wrong() { this.tone(160, 0.18, 'sawtooth', 0.07); },
            win() { [523, 659, 784, 1046].forEach((f, i) => this.tone(f, 0.18, 'sine', 0.11, i * 0.09)); },
            toggle() {
                this.muted = !this.muted;
                localStorage.setItem('dunedle_muted', this.muted ? '1' : '0');
                this.updateIcon();
                if(!this.muted) this.tone(660, 0.1, 'sine', 0.1);

        /* --- ELECCIÓN DE FACCIÓN --- */
        /* --- GUERRA DE FACCIONES (ranking global vía Firebase) --- */
        const FactionWar = {
            db: null,
            deviceId: null,
            available: false,
            init() {
                try {
                    if(typeof firebase === 'undefined' || FIREBASE_CONFIG.apiKey === 'TU_API_KEY') return;
                    if(!firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);
                    this.db = firebase.database();
                    this.deviceId = this.getDeviceId();
                    this.available = true;
                } catch(e) { this.available = false; }
            },
            getDeviceId() {
                let id = localStorage.getItem('dunedle_device_id');
                if(!id){
                    id = (crypto.randomUUID ? crypto.randomUUID() : 'id-' + Date.now() + '-' + Math.random().toString(36).slice(2));
                    localStorage.setItem('dunedle_device_id', id);
                }
                return id;
            },
            monthKey() {
                const d = new Date();
                return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
            },
            daysLeftInMonth() {
                const d = new Date();
                const lastDay = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
                return lastDay - d.getDate();
            },
            async recordWin(game) {
                if(!this.available) return;
                const faction = localStorage.getItem('dunedle_faction');
                if(faction !== 'atreides' && faction !== 'harkonnen') return; // sin facción elegida, no cuenta
                const today = todayStr();
                const receiptId = `${this.deviceId}_${game}_${today}`;
                const receiptRef = this.db.ref('factionWar/receipts/' + receiptId);
                try {
                    // Las reglas solo permiten crear este recibo si no existe ya: si esto falla,
                    // es que ya se contó este punto hoy para este juego y este dispositivo.
                    await receiptRef.set({ device: this.deviceId, game, date: today, faction });
                } catch(e) {
                    return;
                }
                try {
                    const currentMonth = this.monthKey();
                    const currentRef = this.db.ref('factionWar/current');
                    const snap = await currentRef.once('value');
                    const data = snap.val();
                    if(data && data.month && data.month !== currentMonth){
                        await this.db.ref('factionWar/history/' + data.month).set(data);
                        await currentRef.set({ atreides: 0, harkonnen: 0, month: currentMonth });
                    }
                    await currentRef.child(faction).transaction(n => (n || 0) + 1);
                    await currentRef.child('month').set(currentMonth);
                } catch(e) { /* sin conexión o Firebase no disponible: no pasa nada, el recibo ya quedó guardado */ }
            },
            async getStandings() {
                if(!this.available) return null;
                try {
                    const snap = await this.db.ref('factionWar/current').once('value');
                    return snap.val() || { atreides: 0, harkonnen: 0 };
                } catch(e) { return null; }
            },
            async getLastMonthWinner() {
                if(!this.available) return null;
                try {
                    const d = new Date(); d.setMonth(d.getMonth() - 1);
                    const prevMonth = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
                    const snap = await this.db.ref('factionWar/history/' + prevMonth).once('value');
                    const data = snap.val();
                    if(!data) return null;
                    if(data.atreides === data.harkonnen) return { tie: true };
                    return { winner: data.atreides > data.harkonnen ? 'atreides' : 'harkonnen', ...data };
                } catch(e) { return null; }
            }
        };

        const FactionChoice = {

                el.innerHTML = `
                    <div class="modal-box" style="text-align:center;">
                        <h2>⚔️ Elige tu facción</h2>
                        <p>La interfaz cambiará de color según tu elección. Podrás cambiarla luego pulsando tu emblema en la cabecera.</p>
                        <div class="faction-choice-row">
                            <button class="faction-btn" onclick="FactionChoice.choose('atreides')">
                                <span class="faction-emoji">🦅</span><span>Atreides</span>
                            </button>
                            <button class="faction-btn" onclick="FactionChoice.choose('harkonnen')">
                                <span class="faction-emoji">🐏</span><span>Harkonnen</span>
                            </button>

                        ${isReopen ? '<button class="faction-clear-link" onclick="FactionChoice.clear()">Quitar mi facción</button>' : ''}
                        <button class="btn-action" style="margin-top:14px; background:transparent; border:1px solid var(--border-metal); color:#999;" onclick="FactionChoice.close()">Ahora no</button>
                    </div>
                `;
                document.body.appendChild(el);
            },
            close() {
                const el = document.getElementById('faction-overlay');

            },
            choose(faction) {
                ThemeManager.set(faction);
                localStorage.setItem('dunedle_faction', faction);
                this.close();
                this.updateHeaderIcon();
            },
            clear() {
                localStorage.removeItem('dunedle_faction');
                ThemeManager.set('fremen');
                this.close();
                this.updateHeaderIcon();
            },
            maybeShow() {
                if(!localStorage.getItem('dunedle_faction_prompted')){
                    localStorage.setItem('dunedle_faction_prompted', '1');
                    this.show(false);
                }
            },
            updateHeaderIcon() {
                const slot = document.getElementById('theme-selector-slot');
                if(!slot) return;
                const chosen = localStorage.getItem('dunedle_faction');
                if(chosen && this.factions[chosen]){
                    slot.innerHTML = `<button class="icon-btn faction-emblem-btn" onclick="FactionChoice.show(true)" title="Tu facción: ${this.factions[chosen].label}" aria-label="Cambiar facción">${this.factions[chosen].emoji}</button>`;
                } else {
                    slot.innerHTML = `<button class="icon-btn" onclick="FactionChoice.show(false)" title="Elegir facción" aria-label="Elegir facción">⚔️</button>`;
                }
            },
            init() { this.updateHeaderIcon(); }
        };

        /* --- CÓMO JUGAR --- */
        const HowTo = {
            show(onCloseExtra) {
                this._onCloseExtra = onCloseExtra || null;
                const el = document.createElement('div');
                el.className = 'modal-overlay';
                el.id = 'howto-overlay';
                el.onclick = (e) => { if(e.target === el) HowTo.close(); };
                el.innerHTML = `
                    <div class="modal-box">
                        <h2>🏜️ Cómo jugar DUNEDLE</h2>
                        <p>Cada día hay tres retos nuevos basados en el universo de Dune.</p>
                        <h3>🟨 Palabra del día</h3>
                        <p>Adivina la palabra en 6 intentos. Después de cada intento, las casillas cambian de color:</p>
                        <div class="modal-legend">
                            <span><span class="legend-box" style="background:var(--correct)"></span>letra correcta en su lugar</span>
                            <span><span class="legend-box" style="background:var(--present)"></span>letra correcta, lugar equivocado</span>
                            <span><span class="legend-box" style="background:var(--absent)"></span>letra no está en la palabra</span>
                        </div>
                        <h3>😀 Personaje del día</h3>
                        <p>Se revela un emoji nuevo con cada intento fallido. Adivina el personaje antes de quedarte sin pistas.</p>
                        <h3>💬 Frase del día</h3>
                        <p>Lee la cita y adivina quién la dijo, con ayuda del buscador de nombres.</p>
                        <h3>🕵️ ¿Quién es?</h3>
                        <p>Escribe un nombre y compara sus datos (género, altura, facción, pelo, película, libro) con el personaje del día. En verde lo que coincide, en rojo lo que no. La altura además te indica con una flecha si el personaje objetivo es más alto o más bajo.</p>
                        <p style="margin-top:0.8rem; color:var(--sand);">Todos los retos se reinician cada día a medianoche.</p>
                        <button class="btn-action" onclick="HowTo.close()">ENTENDIDO</button>
                    </div>
                `;
                document.body.appendChild(el);
            },
            close() {
                const el = document.getElementById('howto-overlay');
                if(el) el.remove();
                if(this._onCloseExtra){
                    const cb = this._onCloseExtra;
                    this._onCloseExtra = null;
                    cb();
                }
            },
            maybeShowFirstTime() {
                if(!localStorage.getItem('dunedle_howto_seen')){
                    localStorage.setItem('dunedle_howto_seen', '1');
                    this.show(() => FactionChoice.maybeShow());
                }
            }
        };

        /* --- COMPARTIR RESULTADO --- */
        const Share = {
            async copy(text, btn) {
                const original = btn.textContent;
                try {
                    await navigator.clipboard.writeText(text);
                    btn.textContent = '✅ ¡Copiado!';
                } catch(e) {
                    btn.textContent = '⚠️ No se pudo copiar';
                }
                setTimeout(() => { btn.textContent = original; }, 1800);
            },
            wordleText(state) {
                const rows = (state.statuses || []).map(st => st.map(s => s === 'correct' ? '🟩' : s === 'present' ? '🟨' : '⬛').join('')).join('\n');
                return `DUNEDLE 🏜️ Palabra del día ${state.won ? state.guesses.length + '/6' : 'X/6'}\n\n${rows}`;
            },
            simpleText(gameName, won, attempts) {
                return `DUNEDLE 🏜️ ${gameName} — ${won ? `acertado en ${attempts} intento${attempts === 1 ? '' : 's'} ✅` : 'no lo logré hoy ❌'}`;
            }
        };

        /* --- TARJETA VISUAL DE COMPARTIR --- */
        const ShareCard = {
            color(varName, fallback) {
                const v = getComputedStyle(document.documentElement).getPropertyValue(varName).trim();
                return v || fallback;
            },
            dateLabel() {
                return new Date().toLocaleDateString('es-ES', { day: 'numeric', month: 'long', year: 'numeric' });
            },
            wrapText(ctx, text, x, y, maxWidth, lineHeight) {
                const words = text.split(' ');
                let line = '';
                const lines = [];
                words.forEach(word => {
                    const test = line ? line + ' ' + word : word;
                    if(ctx.measureText(test).width > maxWidth && line){
                        lines.push(line); line = word;
                    } else line = test;
                });
                if(line) lines.push(line);
                lines.forEach((l, i) => ctx.fillText(l, x, y + i * lineHeight));
                return lines.length;
            },
            drawBase(ctx, w, h, title, subtitle) {
                const sand = this.color('--sand', '#c2b280');
                const spice = this.color('--spice', '#9d4edd');
                const grad = ctx.createLinearGradient(0, 0, 0, h);
                grad.addColorStop(0, '#15100a'); grad.addColorStop(1, '#050403');
                ctx.fillStyle = grad; ctx.fillRect(0, 0, w, h);
                ctx.fillStyle = spice;
                for(let i = 0; i < 45; i++){
                    ctx.globalAlpha = Math.random() * 0.35 + 0.08;
                    ctx.beginPath();
                    ctx.arc(Math.random() * w, Math.random() * h, Math.random() * 2 + 0.5, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.globalAlpha = 1;
                ctx.strokeStyle = sand; ctx.lineWidth = 3;
                ctx.strokeRect(18, 18, w - 36, h - 36);
                ctx.textAlign = 'center';
                ctx.fillStyle = sand;
                ctx.font = 'bold 46px Georgia, serif';
                ctx.fillText('DUNEDLE', w / 2, 92);
                ctx.font = '17px sans-serif';
                ctx.fillStyle = '#9a9a9a';
                ctx.fillText(this.dateLabel(), w / 2, 120);
                ctx.font = 'bold 24px sans-serif';
                ctx.fillStyle = '#f5f0e6';
                ctx.fillText(title, w / 2, 168);
                if(subtitle){
                    ctx.font = '16px sans-serif';
                    ctx.fillStyle = sand;
                    ctx.fillText(subtitle, w / 2, 194);
                }
                return { sand, spice };
            },
            wordleImage(state, target) {
                const w = 620, h = 780;
                const canvas = document.createElement('canvas'); canvas.width = w; canvas.height = h;
                const ctx = canvas.getContext('2d');
                const { sand } = this.drawBase(ctx, w, h, state.won ? '¡Palabra acertada!' : 'El desierto venció', `${state.won ? state.guesses.length : 'X'}/6 intentos`);
                const rows = state.statuses || [];
                const cols = rows[0] ? rows[0].length : 5;
                const tile = Math.min(52, Math.floor((w - 100) / cols));
                const gap = 8;
                const gridW = cols * tile + (cols - 1) * gap;
                const startX = (w - gridW) / 2;
                let startY = 240;
                const colors = { correct: '#4ade80', present: '#facc15', absent: '#3a3128' };
                rows.forEach((row, r) => {
                    row.forEach((status, c) => {
                        ctx.fillStyle = colors[status] || colors.absent;
                        const x = startX + c * (tile + gap), y = startY + r * (tile + gap);
                        ctx.beginPath();
                        if(ctx.roundRect) ctx.roundRect(x, y, tile, tile, 6); else ctx.rect(x, y, tile, tile);
                        ctx.fill();
                    });
                });
                ctx.font = '15px sans-serif'; ctx.fillStyle = '#888'; ctx.textAlign = 'center';
                ctx.fillText('dunedle · reto diario del universo de Dune', w / 2, h - 40);
                return canvas.toDataURL('image/png');
            },
            emojiImage(target, historyLen, won) {
                const w = 620, h = 700;
                const canvas = document.createElement('canvas'); canvas.width = w; canvas.height = h;
                const ctx = canvas.getContext('2d');
                this.drawBase(ctx, w, h, 'Personaje del día', won ? `Identificado en ${historyLen} intento${historyLen === 1 ? '' : 's'}` : 'No identificado');
                ctx.font = '80px sans-serif'; ctx.textAlign = 'center'; ctx.fillStyle = '#fff';
                ctx.fillText(target.emojis.join(' '), w / 2, 320);
                ctx.font = 'bold 30px sans-serif'; ctx.fillStyle = this.color('--sand', '#c2b280');
                ctx.fillText(won ? target.name : '???', w / 2, 400);
                ctx.font = '15px sans-serif'; ctx.fillStyle = '#888';
                ctx.fillText('dunedle · reto diario del universo de Dune', w / 2, h - 40);
                return canvas.toDataURL('image/png');
            },
            quoteImage(target, historyLen, won) {
                const w = 620, h = 700;
                const canvas = document.createElement('canvas'); canvas.width = w; canvas.height = h;
                const ctx = canvas.getContext('2d');
                this.drawBase(ctx, w, h, 'Frase del día', won ? `Adivinado en ${historyLen} intento${historyLen === 1 ? '' : 's'}` : 'No adivinado');
                ctx.font = 'italic 22px Georgia, serif'; ctx.fillStyle = '#f0e6d2'; ctx.textAlign = 'center';
                this.wrapText(ctx, `"${target.text}"`, w / 2, 290, w - 140, 34);
                ctx.font = 'bold 26px sans-serif'; ctx.fillStyle = this.color('--sand', '#c2b280');
                ctx.fillText(won ? '— ' + target.char : '— ???', w / 2, 460);
                ctx.font = '15px sans-serif'; ctx.fillStyle = '#888';
                ctx.fillText('dunedle · reto diario del universo de Dune', w / 2, h - 40);
                return canvas.toDataURL('image/png');
            },
            async shareOrDownload(dataUrl, filename, textFallback, btn) {
                if(navigator.canShare && navigator.share){
                    try {
                        const blob = await (await fetch(dataUrl)).blob();
                        const file = new File([blob], filename, { type: 'image/png' });
                        if(navigator.canShare({ files: [file] })){
                            await navigator.share({ files: [file], title: 'Dunedle', text: textFallback });
                            return;
                        }
                    } catch(e) { /* si el usuario cancela o falla, seguimos con la descarga */ }
                }
                const a = document.createElement('a');
                a.href = dataUrl; a.download = filename; a.click();
                if(btn){
                    const original = btn.textContent;
                    btn.textContent = '✅ ¡Descargada!';
                    setTimeout(() => { btn.textContent = original; }, 1800);
                }
            },
            preview(dataUrl, filename, textFallback) {
                const el = document.createElement('div');
                el.className = 'modal-overlay';
                el.onclick = (e) => { if(e.target === el) el.remove(); };
                el.innerHTML = `
                    <div class="modal-box" style="text-align:center; max-width:420px;">
                        <h2>📸 Tu resultado</h2>
                        <img src="${dataUrl}" style="width:100%; border-radius:10px; margin:10px 0; border:1px solid var(--border-metal);" alt="Tarjeta de resultado de Dunedle">
                        <button class="share-btn" id="sc-share-btn">📤 Compartir / Descargar imagen</button>
                        <button class="share-btn" id="sc-text-btn" style="border-color:#555; color:#999;">📋 Copiar como texto</button>
                        <button class="btn-action" style="margin-top:10px;" onclick="this.closest('.modal-overlay').remove()">CERRAR</button>
                    </div>
                `;
                document.body.appendChild(el);
                document.getElementById('sc-share-btn').onclick = (e) => this.shareOrDownload(dataUrl, filename, textFallback, e.currentTarget);
                document.getElementById('sc-text-btn').onclick = (e) => Share.copy(textFallback, e.currentTarget);
            }
        };

        window.onload = () => {
            Spice.init(); Confetti.init(); ThemeManager.init(); SoundManager.init();
            FactionChoice.init(); FactionWar.init();
            Router.go('home'); HowTo.maybeShowFirstTime();
        };
    </script>
</body>

</html>
